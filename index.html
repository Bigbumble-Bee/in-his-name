<!DOCTYPE html>
<html>

<head>
    <title>In His Name</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: #c9c4b8;
            font-family: Georgia, serif;
            height: 100vh;
            overflow: hidden;
        }

        .title-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .title-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 10px;
            margin: 0;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 4px;
            color: #77736b;
        }

        .start {
            margin-top: 80px;
            font-size: 16px;
            letter-spacing: 3px;
            color: #aaa59a;
            background: none;
            border: none;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        .start:hover {
            color: #ffffff;
        }

        .loading-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        .loading-screen p {
            font-size: 14px;
            letter-spacing: 5px;
            color: #77736b;
        }

        .game-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        .game-screen p {
            font-size: 18px;
            letter-spacing: 3px;
            color: #aaa59a;
            line-height: 2;
        }

        .black-screen {
            width: 100vw;
            height: 100vh;
            background: #000000;
        }

        .room {
            width: 100vw;
            height: 100vh;
            background: #090909;
            position: relative;
            overflow: hidden;
            animation: roomReveal 5s ease-in-out;
        }

        .back-wall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 68%;
            background: #090909;
            border-bottom: 1px solid #1c1b19;
        }

        .wall-light {
            position: absolute;
            width: 320px;
            height: 240px;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #8f8979;
            filter: blur(80px);
            opacity: 0.035;
        }

        .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 32%;
            background: #11100f;
            border-top: 1px solid #1c1b19;
        }

        .light {
            position: absolute;
            width: 180px;
            height: 180px;
            background: #b8b29f;
            border-radius: 50%;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(45px);
            opacity: 0.12;
        }

        .bed {
            position: absolute;
            width: 55%;
            height: 20%;
            left: 22%;
            bottom: 22%;
            background: #151413;
            border: 1px solid #22201d;
        }

        .pillow {
            position: absolute;
            width: 22%;
            height: 35%;
            left: 5%;
            top: 15%;
            background: #1b1917;
            border: 1px solid #27241f;
        }

        .blanket {
            position: absolute;
            width: 65%;
            height: 70%;
            right: 5%;
            top: 15%;
            background: #121110;
        }

        .fade-out {
            animation: fadeOut 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes roomReveal {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="title-screen">

        <div class="title-content">

            <h1>IN HIS NAME</h1>

            <div class="subtitle">
                A STORY OF FAITH
            </div>

            <button class="start" onclick="beginGame()">
                [ CLICK TO BEGIN ]
            </button>

        </div>

    </div>

    <script>
        function beginGame() {

            document.body.innerHTML = `
                <div class="loading-screen">
                    <p>LOADING...</p>
                </div>
            `;

            setTimeout(function() {

                showStory("You awaken.", function() {

                    showStory("It is still dark.", function() {

                        showStory("You cannot remember falling asleep.", function() {

                            showStory("Something is breathing nearby.", function() {

                                document.body.innerHTML = `
                                    <div class="black-screen"></div>
                                `;

                                setTimeout(function() {

                                    document.body.innerHTML = `
                                        <div class="room">

                                            <div class="back-wall"></div>
                                            <div class="wall-light"></div>

                                            <div class="light"></div>

                                            <div class="floor"></div>

                                            <div class="bed">
                                                <div class="pillow"></div>
                                                <div class="blanket"></div>
                                            </div>

                                        </div>
                                    `;

                                }, 2000);

                            });

                        });

                    });

                });

            }, 5000);
        }


        function showStory(text, next) {

            document.body.innerHTML = `
                <div class="game-screen" id="story">
                    <p>${text}</p>
                </div>
            `;

            setTimeout(function() {

                const story = document.getElementById("story");

                story.classList.add("fade-out");

                setTimeout(function() {

                    if (next) {
                        next();
                    }

                }, 1000);

            }, 3000);
        }
    </script>

</body>

</html>
