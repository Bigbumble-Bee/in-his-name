            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .casefile-document {
            background: #bcb5a6;
            color: #292722;
            padding: 30px;
            margin-bottom: 18px;
            border: 1px solid #625d53;
            cursor: pointer;
        }

        .casefile-document:hover {
            border-color: #827a6b;
        }

        .casefile-document-title {
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .casefile-document-text {
            font-size: 14px;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        .casefile-document-note {
            margin-top: 14px;
            color: #625d53;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .casefile-close {
            display: block;
            margin: 30px auto 0 auto;
            background: none;
            border: none;
            color: #77736b;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
        }

        .casefile-close:hover {
            color: #ffffff;
        }

        .casefile-document-view {
            background: #bcb5a6;
            color: #292722;
            padding: 45px;
            min-height: 38vh;
            border: 1px solid #625d53;
        }

        .casefile-document-view-title {
            font-size: 16px;
            letter-spacing: 4px;
            margin-bottom: 28px;
        }

        .casefile-document-view-text {
            font-size: 15px;
            line-height: 2;
            letter-spacing: 1px;
        }


        /* =========================
           INTERACTION MESSAGE
        ========================= */

        .interaction-message {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa59a;
            font-size: 16px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
        }

        .interaction-message.visible {
            opacity: 1;
        }


        /* =========================
           MOVEMENT HINT
        ========================= */

        .movement-hint {
            position: fixed;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            color: #5f5b53;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }


        /* =========================
           NOTES BUTTON
        ========================= */

        .notes-button {
            position: fixed;
            top: 5%;
            right: 5%;
            color: #77736b;
            font-size: 12px;
            letter-spacing: 3px;
            background: none;
            border: none;
            font-family: Georgia, serif;
            cursor: pointer;
            z-index: 20;
        }

        .notes-button:hover {
            color: #c9c4b8;
        }


        /* =========================
           NOTES WINDOW
        ========================= */

        .notes-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .notes-book {
            width: 60vw;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            min-height: 55vh;
            background: #151412;
            border: 1px solid #37332c;
            padding: 45px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            text-align: left;
        }

        .notes-title {
            text-align: center;
            font-size: 22px;
            letter-spacing: 6px;
            font-weight: normal;
            margin-bottom: 35px;
        }

        .note-entry {
            margin-bottom: 28px;
        }

        .note-entry-title {
            font-size: 15px;
            letter-spacing: 3px;
            color: #c9c4b8;
            margin-bottom: 8px;
        }

        .note-entry-text {
            font-size: 14px;
            line-height: 1.8;
            letter-spacing: 1px;
            color: #88837a;
        }

        .notes-close {
            display: block;
            margin: 35px auto 0 auto;
            background: none;
            border: none;
            color: #77736b;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
        }

        .notes-close:hover {
            color: #ffffff;
        }


        /* =========================
           FADE
        ========================= */

        .fade-out {
            animation: fadeOut 1s ease-in-out forwards;
        }

        @keyframes fadeOut {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <!-- TITLE SCREEN -->

    <div class="title-screen">

        <div class="title-content">

            <h1>IN HIS NAME</h1>

            <div class="subtitle">
                A STORY OF FAITH
            </div>

            <button
                class="start"
                onclick="beginGame()">

                [ CLICK TO BEGIN ]

            </button>

        </div>

    </div>


    <script>


        /* =========================
           GAME STATE
        ========================= */

        let inspectedObjects = {

            bed: false,
            nightstand: false,
            cross: false,
            picture: false,
            door: false

        };


        let firstEventTriggered = false;

        let hallPictureLookedAt = false;

        let sideObjectExamined = false;

        let roomPosition = -40;

        let currentArea = "bedroom";


        /* =========================
           STUDY STATE
        ========================= */

        let studyState = {

            bible: false,
            ordinaryBook: false,
            specialBook: false,
            journal: false,
            journalPage: false,
            journalPhoto: false,
            drawerTop: false,
            drawerMiddle: false,
            drawerBottom: false,
            cabinet: false,
            familyFolder: false,
            clock: false,
            clockChanged: false,
            chair: false,
            paper: false,
            wastebasket: false,
            lamp: false,
            caseFile: false,
            caseDocument: null

        };


        /* =========================
           NOTES
        ========================= */

        let notes = [];


        function addNote(title, text) {

            let alreadyExists = notes.some(function(note) {

                return note.title === title;

            });


            if (!alreadyExists) {

                notes.push({

                    title: title,
                    text: text

                });

            }

        }


        function openNotes() {

            let noteHTML = "";


            if (notes.length === 0) {

                noteHTML = `

                    <div class="note-entry">

                        <div class="note-entry-text">

                            You haven't written anything down yet.

                        </div>

                    </div>

                `;

            }


            else {

                notes.forEach(function(note) {

                    noteHTML += `

                        <div class="note-entry">

                            <div class="note-entry-title">

                                ${note.title}

                            </div>

                            <div class="note-entry-text">

                                ${note.text}

                            </div>

                        </div>

                    `;

                });

            }


            const overlay = document.createElement("div");

            overlay.className = "notes-overlay";

            overlay.id = "notesOverlay";


            overlay.innerHTML = `

                <div class="notes-book">

                    <div class="notes-title">

                        NOTES

                    </div>

                    ${noteHTML}

                    <button
                        class="notes-close"
                        onclick="closeNotes()">

                        [ CLOSE ]

                    </button>

                </div>

            `;


            document.body.appendChild(overlay);

        }


        function closeNotes() {

            const overlay =
                document.getElementById("notesOverlay");


            if (overlay) {

                overlay.remove();

            }

        }


        /* =========================
           BEGIN GAME
        ========================= */

        function beginGame() {

            document.body.innerHTML = `

                <div class="loading-screen">

                    <p>LOADING...</p>

                </div>

            `;


            setTimeout(function() {

                showStory(
                    "You awaken.",
                    function() {

                        showStory(
                            "It is still dark.",
                            function() {

                                showStory(
                                    "You cannot remember falling asleep.",
                                    function() {

                                        showStory(
                                            "Something is breathing nearby.",
                                            function() {

                                                document.body.innerHTML = `

                                                    <div class="black-screen"></div>

                                                `;


                                                setTimeout(function() {

                                                    showRoom();

                                                }, 2000);

                                            }
                                        );

                                    }
                                );

                            }
                        );

                    }
                );

            }, 5000);

        }


        /* =========================
           STORY
        ========================= */

        function showStory(text, next) {

            document.body.innerHTML = `

                <div
                    class="game-screen"
                    id="story">

                    <p>${text}</p>

                </div>

            `;


            setTimeout(function() {

                const story =
                    document.getElementById("story");


                if (!story) {

                    return;

                }


                story.classList.add("fade-out");


                setTimeout(function() {

                    if (next) {

                        next();

                    }

                }, 1000);

            }, 3000);

        }


        /* =========================
           BEDROOM
        ========================= */

        function showRoom() {

            currentArea = "bedroom";

            roomPosition = -40;


            document.body.innerHTML = `

                <div class="room-window">

                    <div
                        class="room"
                        id="room">

                        <div class="back-wall"></div>

                        <div class="wall-light"></div>

                        <div class="light"></div>

                        <div class="floor"></div>


                        <div
                            class="picture"
                            onclick="inspectPicture()">

                            <div class="picture-inner"></div>

                        </div>


                        <div
                            class="cross"
                            onclick="inspectCross()">
                        </div>


                        <div
                            class="nightstand"
                            onclick="inspectNightstand()">

                            <div class="drawer"></div>

                        </div>


                        <div
                            class="door"
                            onclick="inspectDoor()">

                            <div class="door-knob"></div>

                        </div>


                        <div
                            class="bed"
                            onclick="inspectBed()">

                            <div class="pillow"></div>

                            <div class="blanket"></div>

                        </div>

                    </div>


                    <button
                        class="notes-button"
                        onclick="openNotes()">

                        [ NOTES ]

                    </button>


                    <div
                        class="interaction-message"
                        id="interactionMessage">
                    </div>


                    <div class="movement-hint">

                        [ ← → ] LOOK AROUND

                    </div>

                </div>

            `;

        }


        /* =========================
           HALLWAY
        ========================= */

        function showHallway() {

            currentArea = "hallway";

            roomPosition = -40;


            document.body.innerHTML = `

                <div class="room-window">

                    <div
                        class="hallway"
                        id="hallway">

                        <div class="hallway-wall"></div>

                        <div class="hallway-light"></div>

                        <div class="hallway-floor"></div>


                        <div
                            class="hallway-door door-one"
                            onclick="inspectHallDoor(1)">
                        </div>


                        <div
                            class="hallway-door door-two"
                            onclick="inspectHallDoor(2)">
                        </div>


                        <div
                            class="hallway-door door-three"
                            onclick="inspectHallDoor(3)">
                        </div>


                        <div
                            class="hallway-picture"
                            onclick="inspectHallPicture()">
                        </div>

                    </div>


                    <button
                        class="notes-button"
                        onclick="openNotes()">

                        [ NOTES ]

                    </button>


                    <div
                        class="interaction-message"
                        id="interactionMessage">
                    </div>


                    <div class="movement-hint">

                        [ ← → ] LOOK AROUND

                    </div>

                </div>

            `;

        }


        /* =====================================================
           STUDY ROOM
        ===================================================== */

        function enterSideRoom() {

            currentArea = "side-room";

            roomPosition = -40;


            document.body.innerHTML = `

                <div class="room-window">

                    <div
                        class="side-room"
                        id="sideRoom">

                        <div class="side-room-wall"></div>

                        <div class="side-room-floor"></div>


                        <!-- BOOKSHELF -->

                        <div class="bookshelf">

                            <div class="shelf-line shelf-one"></div>
                            <div class="shelf-line shelf-two"></div>
                            <div class="shelf-line shelf-three"></div>


                            <div
                                class="book book-one"
                                onclick="inspectStudyBook(1)">
                            </div>


                            <div
                                class="book book-two"
                                onclick="inspectStudyBook(2)">
                            </div>


                            <div
                                class="book book-three"
                                onclick="inspectStudyBook(3)">
                            </div>


                            <div
                                class="book book-four"
                                onclick="inspectStudyBook(4)">
                            </div>


                            <div
                                class="book book-five"
                                onclick="inspectStudyBook(5)">
                            </div>


                            <div
                                class="special-book"
                                onclick="inspectSpecialBook(); event.stopPropagation()">
                            </div>

                        </div>


                        <!-- ARMCHAIR -->

                        <div
                            class="armchair"
                            onclick="inspectChair()">

                            <div class="chair-back"></div>

                            <div class="chair-seat"></div>

                        </div>


                        <!-- DESK -->

                        <div
                            class="study-desk"
                            onclick="inspectDesk()">

                            <div class="desk-leg-one"></div>
                            <div class="desk-leg-two"></div>


                            <div
                                class="desk-drawer drawer-top"
                                onclick="inspectDeskDrawer(1); event.stopPropagation()">
                            </div>


                            <div
                                class="desk-drawer drawer-middle"
                                onclick="inspectDeskDrawer(2); event.stopPropagation()">
                            </div>


                            <div
                                class="desk-drawer drawer-bottom"
                                onclick="inspectDeskDrawer(3); event.stopPropagation()">
                            </div>

                        </div>


                        <!-- BIBLE -->

                        <div
                            class="study-bible"
                            onclick="inspectBible()">
                        </div>


                        <!-- JOURNAL -->

                        <div
                            class="journal"
                            onclick="inspectJournal()">
                        </div>


                        <!-- PAPER -->

                        <div
                            class="desk-paper"
                            onclick="inspectPaper()">
                        </div>


                        <!-- LAMP -->

                        <div
                            class="desk-lamp"
                            onclick="inspectLamp()">

                            <div class="lamp-base"></div>
                            <div class="lamp-stem"></div>
                            <div class="lamp-shade"></div>

                        </div>


                        <!-- CLOCK -->

                        <div
                            class="study-clock"
                            id="studyClock"
                            onclick="inspectClock()">

                            <div class="clock-hand-one"></div>
                            <div class="clock-hand-two"></div>

                        </div>


                        <!-- FILING CABINET -->

                        <div
                            class="filing-cabinet"
                            onclick="inspectCabinet()">

                            <div class="file-drawer file-one"></div>
                            <div class="file-drawer file-two"></div>
                            <div class="file-drawer file-three"></div>
                            <div class="file-drawer file-four"></div>

                        </div>


                        <!-- WASTEBASKET -->

                        <div
                            class="wastebasket"
                            onclick="inspectWastebasket()">
                        </div>

                    </div>


                    <button
                        class="notes-button"
                        onclick="openNotes()">

                        [ NOTES ]

                    </button>


                    <div
                        class="interaction-message"
                        id="interactionMessage">
                    </div>


                    <div class="movement-hint">

                        [ ← → ] LOOK AROUND

                    </div>

                </div>

            `;

        }


        /* =========================
           CAMERA MOVEMENT
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                let area =
                    document.getElementById("room");


                if (!area) {

                    area =
                        document.getElementById("hallway");

                }


                if (!area) {

                    area =
                        document.getElementById("sideRoom");

                }


                if (!area) {

                    return;

                }


                if (event.key === "ArrowLeft") {

                    roomPosition += 15;


                    if (roomPosition > 0) {

                        roomPosition = 0;

                    }


                    area.style.left =
                        roomPosition + "vw";

                }


                if (event.key === "ArrowRight") {

                    roomPosition -= 15;


                    if (roomPosition < -80) {

                        roomPosition = -80;

                    }


                    area.style.left =
                        roomPosition + "vw";

                }

            }
        );


        /* =========================
           MESSAGE
        ========================= */

        function showMessage(text) {

            const message =
                document.getElementById(
                    "interactionMessage"
                );


            if (!message) {

                return;

            }


            message.textContent = text;


            message.classList.add(
                "visible"
            );


            setTimeout(function() {

                message.classList.remove(
                    "visible"
                );

            }, 3000);

        }


        /* =========================
           INSPECTION PROGRESS
        ========================= */

        function checkInspections() {

            let count = 0;


            for (
                let object in inspectedObjects
            ) {

                if (
                    inspectedObjects[object]
                ) {

                    count++;

                }

            }


            if (
                count === 5 &&
                !firstEventTriggered
            ) {

                firstEventTriggered = true;


                setTimeout(function() {

                    showMessage(
                        "You feel as though you are being watched."
                    );

                }, 1000);

            }

        }


        /* =========================
           BEDROOM DOOR
        ========================= */

        function inspectDoor() {

            if (
                !inspectedObjects.door
            ) {

                showMessage(
                    "The door is locked."
                );


                inspectedObjects.door = true;

            }

            else {

                let examinedCount = 0;


                for (
                    let object in inspectedObjects
                ) {

                    if (
                        inspectedObjects[object]
                    ) {

                        examinedCount++;

                    }

                }


                if (
                    examinedCount < 5
                ) {

                    showMessage(
                        "The handle refuses to turn."
                    );

                }

                else {

                    showMessage(
                        "The handle moves beneath your hand."
                    );


                    setTimeout(function() {

                        openDoor();

                    }, 1500);

                }

            }


            checkInspections();

        }


        /* =========================
           OPEN BEDROOM DOOR
        ========================= */

        function openDoor() {

            showStory(
                "The door opens.",
                function() {

                    showHallway();

                }
            );

        }


        /* =========================
           BED
        ========================= */

        function inspectBed() {

            if (
                !inspectedObjects.bed
            ) {

                showMessage(
                    "The sheets are cold."
                );


                inspectedObjects.bed = true;


                addNote(
                    "BED",
                    "The sheets are cold. There is no warmth left in them."
                );

            }

            else {

                showMessage(
                    "The warmth has already left them."
                );

            }


            checkInspections();

        }


        /* =========================
           NIGHTSTAND
        ========================= */

        function inspectNightstand() {

            if (
                !inspectedObjects.nightstand
            ) {

                showMessage(
                    "There is nothing on it."
                );


                inspectedObjects.nightstand = true;


                addNote(
                    "NIGHTSTAND",
                    "Nothing on the nightstand. I expected to find something."
                );

            }

            else {

                showMessage(
                    "You find nothing new."
                );

            }


            checkInspections();

        }


        /* =========================
           CRUCIFIX
        ========================= */

        function inspectCross() {

            if (
                !inspectedObjects.cross
            ) {

                showMessage(
                    "A wooden cross hangs above the bed."
                );


                inspectedObjects.cross = true;


                addNote(
                    "CROSS",
                    "A wooden cross hangs above the bed."
                );

            }

            else {

                showMessage(
                    "You have always found comfort in it."
                );

            }


            checkInspections();

        }


        /* =========================
           BEDROOM PICTURE
        ========================= */

        function inspectPicture() {

            if (
                !inspectedObjects.picture
            ) {

                showMessage(
                    "The picture is too dark to make out."
                );


                inspectedObjects.picture = true;


                addNote(
                    "PHOTOGRAPH",
                    "An old photograph. There are several people in it. One face feels strangely familiar."
                );

            }

            else {

                showMessage(
                    "You know these people."
                );


                setTimeout(function() {

                    showMessage(
                        "You can't remember from where."
                    );

                }, 2200);


                addNote(
                    "PHOTOGRAPH",
                    "An old photograph. One of the boys in it feels familiar. I can't remember where I've seen him."
                );

            }


            checkInspections();

        }


        /* =========================
           HALLWAY DOORS
        ========================= */

        function inspectHallDoor(doorNumber) {

            if (doorNumber === 1) {

                showMessage(
                    "Locked."
                );

            }


            else if (doorNumber === 2) {

                showMessage(
                    "The door is already open."
                );


                setTimeout(function() {

                    enterSideRoom();

                }, 1500);

            }


            else if (doorNumber === 3) {

                showMessage(
                    "There is no handle."
                );

            }

        }


        /* =========================
           HALLWAY PICTURE
        ========================= */

        function inspectHallPicture() {

            if (!hallPictureLookedAt) {

                hallPictureLookedAt = true;


                if (inspectedObjects.picture) {

                    showMessage(
                        "You stop."
                    );


                    setTimeout(function() {

                        showMessage(
                            "That face..."
                        );

                    }, 1800);


                    setTimeout(function() {

                        showMessage(
                            "You've seen it before."
                        );

                    }, 3600);


                    addNote(
                        "THE PAINTING",
                        "The face in the hallway painting looks familiar. It reminds me of someone in the photograph."
                    );

                }

                else {

                    showMessage(
                        "The face in the painting is difficult to see."
                    );


                    addNote(
                        "THE PAINTING",
                        "There is a man in the hallway painting. His face is difficult to see."
                    );

                }

            }

            else {

                if (inspectedObjects.picture) {

                    showMessage(
                        "You can't remember where you've seen him."
                    );

                }

                else {

                    showMessage(
                        "You could swear the eyes were looking at you."
                    );

                }

            }

        }


        /* =====================================================
           STUDY INTERACTIONS
        ===================================================== */

        function inspectDesk() {

            showMessage(
                "A heavy wooden desk. Someone spent a lot of time here."
            );


            addNote(
                "THE STUDY",
                "An old study. The desk looks as though it has been used for years."
            );

        }


        /* =========================
           BOOKS
        ========================= */

        function inspectStudyBook(number) {

            if (!studyState.ordinaryBook) {

                studyState.ordinaryBook = true;


                showMessage(
                    "Religious books. Most of them have been read."
                );


                addNote(
                    "BOOKS",
                    "Most of the books in the study are about faith, scripture, or church history."
                );

            }

            else {

                if (number === 1) {

                    showMessage(
                        "The spine is worn from years of use."
                    );

                }

                else if (number === 2) {

                    showMessage(
                        "You don't remember ever reading this."
                    );

                }

                else if (number === 3) {

                    showMessage(
                        "There is dust along the top."
                    );

                }

                else if (number === 4) {

                    showMessage(
                        "A receipt is being used as a bookmark."
                    );

                }

                else {

                    showMessage(
                        "Nothing unusual."
                    );

                }

            }

        }


        /* =========================
           SPECIAL BOOK
        ========================= */

        function inspectSpecialBook() {

            if (!studyState.specialBook) {

                studyState.specialBook = true;


                showMessage(
                    "Something is tucked between the pages."
                );


                setTimeout(function() {

                    showMessage(
                        "A folded piece of paper."
                    );

                }, 1800);


                setTimeout(function() {

                    showMessage(
                        "\"Don't bring him here again.\""
                    );

                }, 3600);


                addNote(
                    "FOLDED NOTE",
                    "A note was hidden inside a book: \"Don't bring him here again.\" Beneath it, a name has been smeared. Only \"jul-\" can be made out."
                );

            }

            else {

                showMessage(
                    "The page is empty now."
                );

            }

        }


        /* =========================
           BIBLE
        ========================= */

        function inspectBible() {

            if (!studyState.bible) {

                studyState.bible = true;


                showMessage(
                    "The pages are worn from use."
                );


                setTimeout(function() {

                    showMessage(
                        "Someone underlined something."
                    );

                }, 2000);


                setTimeout(function() {

                    showMessage(
                        "You don't remember doing it."
                    );

                }, 4000);


                addNote(
                    "BIBLE",
                    "An old Bible. Several passages have been underlined. One of the marks looks strangely familiar."
                );

            }

            else {

                showMessage(
                    "The same passage is still underlined."
                );

            }

        }


        /* =====================================================
           JOURNAL — STUDY V2
        ===================================================== */

        let journalHeld = false;
        let journalPageIndex = 0;

        const journalPages = [
            {
                left: `
                    <div class="journal-page-number">JUNE 19</div>
                    <div class="journal-handwriting">
                        He said he wasn't afraid of me.<br><br>
                        I believed him.
                    </div>
                `,
                right: `
                    <div class="journal-page-number">PAGE 17</div>
                    <div class="journal-handwriting">
                        <span class="unreadable">jul-</span><br><br>
                        <span class="unreadable">The rest of the line has been worn away.</span>
                    </div>
                `
            },
            {
                left: `
                    <div class="journal-page-number">JUNE 20</div>
                    <div class="journal-handwriting">
                        I shouldn't have—
                    </div>
                `,
                right: `
                    <div class="journal-page-number">PAGE 18</div>
                    <div class="journal-handwriting">
                        Nothing else is written here.
                    </div>
                `
            },
            {
                left: `
                    <div class="journal-page-number">LOOSE PHOTOGRAPH</div>
                    <div class="journal-handwriting">
                        Something was tucked between these pages.
                    </div>
                `,
                right: `
                    <div
                        class="journal-photo-object"
                        onclick="openJournalPhoto(); event.stopPropagation();">
                        <span>PHOTOGRAPH<br>[ EXAMINE ]</span>
                    </div>
                `
            }
        ];


        function inspectJournal() {

            studyState.journal = true;

            openJournalExamination();

        }


        function openJournalExamination() {

            closeJournalOverlay();


            const overlay = document.createElement("div");

            overlay.className = "journal-overlay";
            overlay.id = "journalOverlay";


            overlay.innerHTML = `

                <div class="journal-examination">

                    <div class="journal-examination-title">
                        JOURNAL
                    </div>


                    <div id="journalExaminationContent">

                        <div
                            class="journal-object"
                            onclick="pickUpJournal()">

                            <span>
                                OLD JOURNAL
                            </span>

                        </div>


                        <div class="journal-status">
                            You recognize the handwriting.
                        </div>


                        <div class="journal-controls">

                            <button
                                class="journal-control"
                                onclick="pickUpJournal()">

                                [ PICK UP ]

                            </button>


                            <button
                                class="journal-control"
                                onclick="closeJournalOverlay()">

                                [ PUT DOWN ]

                            </button>

                        </div>

                    </div>

                </div>

            `;


            document.body.appendChild(overlay);


            addNote(
                "OLD JOURNAL",
                "An old journal. The handwriting looks like mine. I don't remember owning it."
            );

        }


        function pickUpJournal() {

            journalHeld = true;
            journalPageIndex = 0;

            renderHeldJournal();

        }


        function putDownJournal() {

            journalHeld = false;

            closeJournalOverlay();

            showMessage(
                "You put the journal down."
            );

        }


        function renderHeldJournal() {

            const content =
                document.getElementById(
                    "journalExaminationContent"
                );


            if (!content) {

                return;

            }


            content.innerHTML = `

                <div class="journal-status">
                    The journal is in your hands.
                </div>


                <div class="journal-page-view">

                    ${journalPages[journalPageIndex].left}

                    ${journalPages[journalPageIndex].right}

                </div>


                <div class="journal-controls">

                    <button
                        class="journal-control"
                        onclick="previousJournalPage()">

                        [ PREVIOUS ]

                    </button>


                    <button
                        class="journal-control"
                        onclick="nextJournalPage()">

                        [ TURN PAGE ]

                    </button>


                    <button
                        class="journal-control"
                        onclick="putDownJournal()">

                        [ PUT DOWN ]

                    </button>

                </div>

            `;


            if (!studyState.journalPage) {

                studyState.journalPage = true;


                addNote(
                    "JOURNAL ENTRY",
                    'June 19. "He said he wasn\'t afraid of me. I believed him." The next line begins with "jul-" but the rest is unreadable.'
                );

            }

        }


        function previousJournalPage() {

            if (journalPageIndex > 0) {

                journalPageIndex--;

                renderHeldJournal();

            }

            else {

                showMessage(
                    "There are no earlier pages."
                );

            }

        }


        function nextJournalPage() {

            if (
                journalPageIndex <
                journalPages.length - 1
            ) {

                journalPageIndex++;

                renderHeldJournal();


                if (
                    journalPageIndex === 2 &&
                    !studyState.journalPhoto
                ) {

                    revealJournalPhoto();

                }

            }

            else {

                showMessage(
                    "The journal ends here."
                );

            }

        }


        function closeJournalOverlay() {

            const overlay =
                document.getElementById(
                    "journalOverlay"
                );


            if (overlay) {

                overlay.remove();

            }

        }


        /* =========================
           JOURNAL PHOTOGRAPH
        ========================= */


        function revealJournalPhoto() {

            if (!studyState.journalPhoto) {

                studyState.journalPhoto = true;


                showMessage(
                    "Something slips from the journal."
                );


                setTimeout(function() {

                    showMessage(
                        "A photograph."
                    );

                }, 1800);


                addNote(
                    "SECOND PHOTOGRAPH",
                    "A photograph fell from the journal. I am in it. There is another boy beside me. I don't know who he is."
                );

            }

        }


        function openJournalPhoto() {

            const overlay = document.createElement("div");

            overlay.className = "physical-photo-overlay";
            overlay.id = "photoOverlay";


            overlay.innerHTML = `

                <div class="physical-photo">

                    <span>
                        YOU RECOGNIZE YOURSELF.<br><br>
                        YOU DON'T RECOGNIZE THE BOY BESIDE YOU.
                    </span>

                </div>

            `;


            overlay.onclick = function() {

                overlay.remove();

            };


            document.body.appendChild(overlay);

        }



        /* =========================
           DESK DRAWERS
        ========================= */

        function inspectDeskDrawer(drawerNumber) {

            if (drawerNumber === 1) {

                if (!studyState.drawerTop) {

                    studyState.drawerTop = true;


                    showMessage(
                        "Pens. Batteries. Old receipts."
                    );


                    addNote(
                        "DESK DRAWER",
                        "The top drawer contains ordinary things. Pens, batteries, receipts."
                    );

                }

                else {

                    showMessage(
                        "Nothing new."
                    );

                }

            }


            else if (drawerNumber === 2) {

                if (!studyState.drawerMiddle) {

                    studyState.drawerMiddle = true;


                    showMessage(
                        "Old letters."
                    );


                    setTimeout(function() {

                        showMessage(
                            "You know this handwriting."
                        );

                    }, 1800);


                    addNote(
                        "OLD LETTERS",
                        "There are old letters in the desk. I recognize the handwriting, but I don't remember whose it is."
                    );

                }

                else {

                    showMessage(
                        "The letters say nothing you can understand."
                    );

                }

            }


            else if (drawerNumber === 3) {

                if (!studyState.drawerBottom) {

                    studyState.drawerBottom = true;


                    showMessage(
                        "Locked."
                    );


                    setTimeout(function() {

                        showMessage(
                            "Something is inside."
                        );

                    }, 1800);


                    addNote(
                        "LOCKED DESK DRAWER",
                        "The bottom desk drawer is locked. Something is inside."
                    );

                }

                else {

                    showMessage(
                        "Still locked."
                    );

                }

            }

        }


        /* =========================
           FILING CABINET
        ========================= */

        function inspectCabinet() {

            if (!studyState.cabinet) {

                studyState.cabinet = true;


                showMessage(
                    "Old family records."
                );


                setTimeout(function() {

                    showMessage(
                        "One folder is marked D / J."
                    );

                }, 2200);


                addNote(
                    "FAMILY RECORDS",
                    "The filing cabinet contains old family documents. One folder is marked \"D / J.\""
                );

            }

            else if (!studyState.familyFolder) {

                studyState.familyFolder = true;


                showMessage(
                    "The folder is empty."
                );


                setTimeout(function() {

                    showMessage(
                        "No."
                    );

                }, 1800);


                setTimeout(function() {

                    showMessage(
                        "Something is underneath it."
                    );

                }, 3600);


                addNote(
                    "EMPTY FOLDER",
                    "The D / J folder is empty. A small piece of paper was underneath it: \"He knows.\""
                );

            }

            else if (!studyState.caseFile) {

                studyState.caseFile = true;


                showMessage(
                    "There is something behind the folder."
                );


                setTimeout(function() {

                    showMessage(
                        "A case file."
                    );

                }, 1800);


                setTimeout(function() {

                    openCaseFile();

                }, 3300);


                addNote(
                    "CASE FILE",
                    "Something was hidden behind the empty D / J folder. It is an old case file."
                );

            }

            else {

                openCaseFile();

            }

        }


        /* =====================================================
           CASE FILE — DOCUMENT EXAMINATION
        ===================================================== */

        const caseDocuments = [
            {
                title: "FAMILY RECORD",
                text: "The document is old enough that the paper has yellowed. Most of it concerns ordinary family information. One section has been removed.",
                note: "A section has been cut away."
            },
            {
                title: "HANDWRITTEN NOTE",
                text: "The handwriting is familiar. You cannot place it. Only the beginning of a name remains visible: \"jul-\"",
                note: "The rest has been deliberately obscured."
            },
            {
                title: "PHOTOGRAPH",
                text: "A small photograph is attached to the file. You recognize yourself. The other boy is still unfamiliar.",
                note: "The same face from the journal photograph."
            },
            {
                title: "UNSIGNED STATEMENT",
                text: "Several lines have been crossed out. The remaining words are difficult to understand. Someone did not want this kept intact.",
                note: "The page has been folded several times."
            }
        ];


        function openCaseFile() {

            closeCaseFile();


            const overlay = document.createElement("div");

            overlay.className = "casefile-overlay";
            overlay.id = "caseFileOverlay";


            overlay.innerHTML = `

                <div class="casefile-folder">

                    <div class="casefile-title">
                        CASE FILE
                    </div>

                    <div class="casefile-subtitle">
                        D / J
                    </div>


                    <div id="caseFileContent">

                        ${renderCaseFileList()}

                    </div>


                    <button
                        class="casefile-close"
                        onclick="closeCaseFile()">

                        [ CLOSE ]

                    </button>

                </div>

            `;


            document.body.appendChild(overlay);

        }


        function renderCaseFileList() {

            let output = "";


            caseDocuments.forEach(function(documentItem, index) {

                output += `

                    <div
                        class="casefile-document"
                        onclick="examineCaseDocument(${index})">

                        <div class="casefile-document-title">
                            ${documentItem.title}
                        </div>

                        <div class="casefile-document-text">
                            ${documentItem.text}
                        </div>

                        <div class="casefile-document-note">
                            [ EXAMINE ]
                        </div>

                    </div>

                `;

            });


            return output;

        }


        function examineCaseDocument(index) {

            const documentItem =
                caseDocuments[index];


            const content =
                document.getElementById(
                    "caseFileContent"
                );


            if (!content) {

                return;

            }


            studyState.caseDocument = index;


            content.innerHTML = `

                <div class="casefile-document-view">

                    <div class="casefile-document-view-title">
                        ${documentItem.title}
                    </div>

                    <div class="casefile-document-view-text">
                        ${documentItem.text}
                        <br><br>
                        <span style="color:#625d53;">
                            ${documentItem.note}
                        </span>
                    </div>

                </div>


                <div class="journal-controls">

                    <button
                        class="journal-control"
                        onclick="openCaseFile()">

                        [ BACK TO FILE ]

                    </button>


                    <button
                        class="journal-control"
                        onclick="closeCaseFile()">

                        [ CLOSE ]

                    </button>

                </div>

            `;


            addNote(
                "CASE DOCUMENT",
                "You examined a document from the D / J case file: " +
                documentItem.title +
                "."
            );

        }


        function closeCaseFile() {

            const overlay =
                document.getElementById(
                    "caseFileOverlay"
                );


            if (overlay) {

                overlay.remove();

            }

        }




        /* =========================
           CLOCK
        ========================= */

        function inspectClock() {

            if (!studyState.clock) {

                studyState.clock = true;


                showMessage(
                    "The clock has stopped."
                );


                setTimeout(function() {

                    showMessage(
                        "3:17."
                    );

                }, 1800);


                addNote(
                    "CLOCK",
                    "The study clock has stopped at 3:17."
                );

            }

            else if (
                studyState.journal &&
                !studyState.clockChanged
            ) {

                studyState.clockChanged = true;


                const clock =
                    document.getElementById(
                        "studyClock"
                    );


                if (clock) {

                    clock.style.transform =
                        "translateX(1px)";

                }


                showMessage(
                    "3:18."
                );


                setTimeout(function() {

                    showMessage(
                        "You didn't hear it move."
                    );

                }, 2000);


                addNote(
                    "THE CLOCK",
                    "The study clock was stopped at 3:17. After reading the journal, it now says 3:18."
                );

            }

            else {

                showMessage(
                    "3:18."
                );

            }

        }


        /* =========================
           CHAIR
        ========================= */

        function inspectChair() {

            if (!studyState.chair) {

                studyState.chair = true;


                showMessage(
                    "The chair smells faintly of dust."
                );


                addNote(
                    "ARMCHAIR",
                    "An old armchair sits in the corner. It looks recently used."
                );

            }

            else {

                showMessage(
                    "Someone was sitting here recently."
                );

            }

        }


        /* =========================
           PAPER
        ========================= */

        function inspectPaper() {

            if (!studyState.paper) {

                studyState.paper = true;


                showMessage(
                    "A handwritten reminder."
                );


                setTimeout(function() {

                    showMessage(
                        "\"2:30 — pick him up.\""
                    );

                }, 1800);


                addNote(
                    "HANDWRITTEN REMINDER",
                    "A note on the desk reads: \"2:30 — pick him up.\" There is no name."
                );

            }

            else {

                showMessage(
                    "\"2:30 — pick him up.\""
                );

            }

        }


        /* =========================
           WASTEBASKET
        ========================= */

        function inspectWastebasket() {

            if (!studyState.wastebasket) {

                studyState.wastebasket = true;


                showMessage(
                    "Old papers."
                );


                setTimeout(function() {

                    showMessage(
                        "Most of them have been torn up."
                    );

                }, 1800);


                addNote(
                    "TORN PAPERS",
                    "Someone tore up several old pages and threw them away."
                );

            }

            else {

                showMessage(
                    "There is nothing intact enough to read."
                );

            }

        }


        /* =========================
           LAMP
        ========================= */

        function inspectLamp() {

            if (!studyState.lamp) {

                studyState.lamp = true;


                showMessage(
                    "The lamp doesn't turn on."
                );


                addNote(
                    "DESK LAMP",
                    "The desk lamp doesn't work."
                );

            }

            else {

                showMessage(
                    "Still dead."
                );

            }

        }


    </script>

</body>

</html>
