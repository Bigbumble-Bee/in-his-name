<!DOCTYPE html>
<html>

<head>
    <title>In His Name</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: #c9c4b8;
            font-family: Georgia, serif;
            height: 100vh;
            overflow: hidden;
        }

        .title-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .title-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 10px;
            margin: 0;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 4px;
            color: #77736b;
        }

        .start {
            margin-top: 80px;
            font-size: 16px;
            letter-spacing: 3px;
            color: #aaa59a;
            background: none;
            border: none;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        .start:hover {
            color: #ffffff;
        }

        .loading-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .loading-screen p {
            font-size: 14px;
            letter-spacing: 5px;
            color: #77736b;
        }

        .game-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .game-screen p {
            font-size: 18px;
            letter-spacing: 3px;
            color: #aaa59a;
            line-height: 2;
        }

        .black-screen {
            width: 100vw;
            height: 100vh;
            background: #000000;
        }

        /* ROOM */

        .room {
            width: 100vw;
            height: 100vh;
            background: #090909;
            position: relative;
            overflow: hidden;
        }

        .back-wall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 68%;
            background: #090909;
            border-bottom: 1px solid #1c1b19;
        }

        .wall-light {
            position: absolute;
            width: 320px;
            height: 240px;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #8f8979;
            filter: blur(80px);
            opacity: 0.035;
        }

        .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 32%;
            background: #11100f;
            border-top: 1px solid #1c1b19;
        }

        .light {
            position: absolute;
            width: 180px;
            height: 180px;
            background: #b8b29f;
            border-radius: 50%;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(45px);
            opacity: 0.12;
        }

        /* DOOR */

        .door {
            position: absolute;
            width: 16%;
            height: 45%;
            right: 8%;
            bottom: 32%;
            background: #11100f;
            border: 1px solid #24211d;
            box-sizing: border-box;
            cursor: pointer;
        }

        .door:hover {
            border-color: #3a352d;
        }

        .door-knob {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            right: 12%;
            top: 52%;
            background: #4a463d;
        }

        /* BED */

        .bed {
            position: absolute;
            width: 55%;
            height: 20%;
            left: 22%;
            bottom: 22%;
            background: #191816;
            border: 1px solid #2b2823;
            box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .bed:hover {
            border-color: #3a352d;
        }

        .pillow {
            position: absolute;
            width: 22%;
            height: 35%;
            left: 5%;
            top: 15%;
            background: #211f1c;
            border: 1px solid #302c26;
            box-sizing: border-box;
        }

        .blanket {
            position: absolute;
            width: 65%;
            height: 70%;
            right: 5%;
            top: 15%;
            background: #171513;
            border: 1px solid #211e1a;
            box-sizing: border-box;
        }

        /* NIGHTSTAND */

        .nightstand {
            position: absolute;
            width: 10%;
            height: 15%;
            left: 8%;
            bottom: 32%;
            background: #121110;
            border: 1px solid #211f1c;
            cursor: pointer;
        }

        .nightstand:hover {
            border-color: #3a352d;
        }

        .drawer {
            position: absolute;
            width: 70%;
            height: 25%;
            left: 15%;
            top: 20%;
            border: 1px solid #27241f;
        }

        /* CRUCIFIX */

        .cross {
            position: absolute;
            width: 4px;
            height: 70px;
            left: 35%;
            top: 18%;
            background: #25221e;
            cursor: pointer;
        }

        .cross::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 4px;
            left: 50%;
            top: 25px;
            transform: translateX(-50%);
            background: #25221e;
        }

        /* PICTURE */

        .picture {
            position: absolute;
            width: 12%;
            height: 16%;
            left: 8%;
            top: 14%;
            border: 3px solid #25221e;
            box-sizing: border-box;
            background: #11100f;
            cursor: pointer;
        }

        .picture:hover {
            border-color: #3a352d;
        }

        .picture-inner {
            position: absolute;
            width: 70%;
            height: 70%;
            left: 15%;
            top: 15%;
            background: #171614;
        }

        /* MESSAGE */

        .interaction-message {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa59a;
            font-size: 16px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .interaction-message.visible {
            opacity: 1;
        }

        /* FADE */

        .fade-out {
            animation: fadeOut 1s ease-in-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>


<body>

    <div class="title-screen">

        <div class="title-content">

            <h1>IN HIS NAME</h1>

            <div class="subtitle">
                A STORY OF FAITH
            </div>

            <button class="start" onclick="beginGame()">
                [ CLICK TO BEGIN ]
            </button>

        </div>

    </div>


    <script>

        /* =========================
           GAME STATE
        ========================= */

        let inspectedObjects = {
            bed: false,
            nightstand: false,
            cross: false,
            picture: false,
            door: false
        };

        let firstEventTriggered = false;


        /* =========================
           BEGIN GAME
        ========================= */

        function beginGame() {

            document.body.innerHTML = `
                <div class="loading-screen">
                    <p>LOADING...</p>
                </div>
            `;

            setTimeout(function() {

                showStory("You awaken.", function() {

                    showStory("It is still dark.", function() {

                        showStory("You cannot remember falling asleep.", function() {

                            showStory("Something is breathing nearby.", function() {

                                document.body.innerHTML = `
                                    <div class="black-screen"></div>
                                `;

                                setTimeout(function() {

                                    showRoom();

                                }, 2000);

                            });

                        });

                    });

                });

            }, 5000);
        }


        /* =========================
           STORY TEXT
        ========================= */

        function showStory(text, next) {

            document.body.innerHTML = `
                <div class="game-screen" id="story">
                    <p>${text}</p>
                </div>
            `;

            setTimeout(function() {

                const story =
                    document.getElementById("story");

                story.classList.add("fade-out");

                setTimeout(function() {

                    if (next) {
                        next();
                    }

                }, 1000);

            }, 3000);
        }


        /* =========================
           ROOM
        ========================= */

        function showRoom() {

            document.body.innerHTML = `
                <div class="room">

                    <div class="back-wall"></div>

                    <div class="wall-light"></div>

                    <div class="light"></div>

                    <div class="floor"></div>


                    <div class="picture"
                         onclick="inspectPicture()">

                        <div class="picture-inner"></div>

                    </div>


                    <div class="cross"
                         onclick="inspectCross()">
                    </div>


                    <div class="nightstand"
                         onclick="inspectNightstand()">

                        <div class="drawer"></div>

                    </div>


                    <div class="door"
                         onclick="inspectDoor()">

                        <div class="door-knob"></div>

                    </div>


                    <div class="bed"
                         onclick="inspectBed()">

                        <div class="pillow"></div>

                        <div class="blanket"></div>

                    </div>


                    <div class="interaction-message"
                         id="interactionMessage">
                    </div>

                </div>
            `;
        }


        /* =========================
           MESSAGE
        ========================= */

        function showMessage(text) {

            const message =
                document.getElementById("interactionMessage");

            message.textContent = text;

            message.classList.add("visible");

            setTimeout(function() {

                message.classList.remove("visible");

            }, 3000);
        }


        /* =========================
           CHECK PROGRESS
        ========================= */

        function checkInspections() {

            let count = 0;

            for (let object in inspectedObjects) {

                if (inspectedObjects[object]) {
                    count++;
                }

            }

            if (count === 5 && !firstEventTriggered) {

                firstEventTriggered = true;

                setTimeout(function() {

                    showMessage(
                        "You feel as though you are being watched."
                    );

                }, 1000);

            }
        }


        /* =========================
           OBJECT INTERACTIONS
        ========================= */

        function inspectDoor() {

            if (!inspectedObjects.door) {

                showMessage("The door is closed.");

                inspectedObjects.door = true;

            } else {

                showMessage("You try the handle again.");

            }

            checkInspections();
        }


        function inspectBed() {

            if (!inspectedObjects.bed) {

                showMessage("The sheets are cold.");

                inspectedObjects.bed = true;

            } else {

                showMessage(
                    "The warmth has already left them."
                );

            }

            checkInspections();
        }


        function inspectNightstand() {

            if (!inspectedObjects.nightstand) {

                showMessage("There is nothing on it.");

                inspectedObjects.nightstand = true;

            } else {

                showMessage("You find nothing new.");

            }

            checkInspections();
        }


        function inspectCross() {

            if (!inspectedObjects.cross) {

                showMessage(
                    "A wooden cross hangs above the bed."
                );

                inspectedObjects.cross = true;

            } else {

                showMessage(
                    "You have always found comfort in it."
                );

            }

            checkInspections();
        }


        function inspectPicture() {

            if (!inspectedObjects.picture) {

                showMessage(
                    "The picture is too dark to make out."
                );

                inspectedObjects.picture = true;

            } else {

                showMessage(
                    "You think you recognize the faces."
                );

            }

            checkInspections();
        }

    </script>

</body>

</html>
