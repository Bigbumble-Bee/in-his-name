<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>In His Name</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #080808;
            color: #c9c4b8;
            font-family: Georgia, serif;
        }

        button {
            font-family: Georgia, serif;
        }


        /* =========================================================
           GENERAL
        ========================================================= */

        .screen {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        .hidden {
            display: none !important;
        }


        /* =========================================================
           TITLE SCREEN
        ========================================================= */

        #title-screen {
            background: #080808;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #title-screen h1 {
            margin: 0;
            font-size: 4rem;
            letter-spacing: 0.25em;
            font-weight: normal;
            color: #d1ccc1;
        }

        #title-screen p {
            margin-top: 18px;
            font-size: 0.95rem;
            letter-spacing: 0.35em;
            color: #777269;
        }

        #start-button {
            margin-top: 70px;
            background: none;
            border: none;
            color: #716c64;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            cursor: pointer;
        }

        #start-button:hover {
            color: #aaa49a;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        #loading-screen {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
            letter-spacing: 0.18em;
            font-size: 0.8rem;
        }


        /* =========================================================
           STORY TEXT
        ========================================================= */

        #story-screen {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        #story-text {
            max-width: 650px;
            text-align: center;
            line-height: 2;
            font-size: 1.05rem;
            color: #bdb8ae;
        }


        /* =========================================================
           GAME WORLD
        ========================================================= */

        #game-screen {
            background: #080808;
            overflow: hidden;
        }

        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 180vw;
            height: 100vh;
            transition: left 0.45s ease;
        }

        .room {
            position: absolute;
            top: 0;
            width: 60vw;
            height: 100vh;
            overflow: hidden;
            background: #101010;
        }

        .room-floor {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 25vh;
            background: #171513;
            border-top: 1px solid #24211e;
        }

        .room-wall {
            position: absolute;
            inset: 0;
            bottom: 25vh;
            background:
                linear-gradient(
                    to bottom,
                    #111 0%,
                    #151412 75%,
                    #111 100%
                );
        }


        /* =========================================================
           BEDROOM
        ========================================================= */

        #bedroom {
            left: 0;
        }

        .bed {
            position: absolute;
            left: 8vw;
            bottom: 18vh;
            width: 25vw;
            height: 22vh;
            background: #1b1a18;
            border: 1px solid #292725;
            cursor: pointer;
        }

        .bed-mattress {
            position: absolute;
            left: 2%;
            top: 7%;
            width: 96%;
            height: 58%;
            background: #272522;
            border: 1px solid #33302b;
        }

        .bed-pillow {
            position: absolute;
            left: 7%;
            top: 14%;
            width: 27%;
            height: 30%;
            background: #302e2a;
            border: 1px solid #393630;
        }

        .bed-frame {
            position: absolute;
            left: 4%;
            right: 4%;
            bottom: -10%;
            height: 13%;
            background: #141311;
        }

        .nightstand {
            position: absolute;
            left: 36vw;
            bottom: 18vh;
            width: 7vw;
            height: 15vh;
            background: #1a1816;
            border: 1px solid #292724;
            cursor: pointer;
        }

        .nightstand-top {
            position: absolute;
            top: -5px;
            left: -3px;
            right: -3px;
            height: 7px;
            background: #27241f;
        }

        .cross {
            position: absolute;
            left: 48vw;
            top: 23vh;
            width: 70px;
            height: 105px;
            cursor: pointer;
        }

        .cross::before {
            content: "";
            position: absolute;
            left: 29px;
            top: 0;
            width: 12px;
            height: 100%;
            background: #302b25;
        }

        .cross::after {
            content: "";
            position: absolute;
            left: 0;
            top: 30px;
            width: 70px;
            height: 12px;
            background: #302b25;
        }

        .bedroom-picture {
            position: absolute;
            left: 18vw;
            top: 13vh;
            width: 8vw;
            height: 11vh;
            background: #282621;
            border: 7px solid #171614;
            cursor: pointer;
        }

        .bedroom-picture::after {
            content: "";
            position: absolute;
            inset: 10px;
            background: #181817;
        }

        .bedroom-door {
            position: absolute;
            right: 5vw;
            bottom: 25vh;
            width: 9vw;
            height: 58vh;
            background: #171513;
            border: 1px solid #2d2925;
            cursor: pointer;
        }

        .bedroom-door-handle {
            position: absolute;
            right: 14px;
            top: 51%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #635b4f;
        }


        /* =========================================================
           HALLWAY
        ========================================================= */

        #hallway {
            left: 60vw;
        }

        .hallway-wall {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    to right,
                    #0c0c0c,
                    #141311 40%,
                    #111 100%
                );
        }

        .hall-door {
            position: absolute;
            bottom: 25vh;
            width: 10vw;
            height: 57vh;
            background: #171513;
            border: 1px solid #292622;
        }

        .hall-door.one {
            left: 7vw;
            cursor: pointer;
        }

        .hall-door.two {
            left: 25vw;
            cursor: pointer;
        }

        .hall-door.three {
            left: 44vw;
        }

        .hall-door-handle {
            position: absolute;
            right: 12px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #595248;
        }

        .hall-picture {
            position: absolute;
            left: 17vw;
            top: 12vh;
            width: 8vw;
            height: 12vh;
            background: #25231f;
            border: 6px solid #171614;
            cursor: pointer;
        }

        .hall-picture::after {
            content: "";
            position: absolute;
            inset: 12px;
            background:
                linear-gradient(
                    140deg,
                    #292723,
                    #121212
                );
        }


        /* =========================================================
           STUDY
        ========================================================= */

        #study {
            left: 120vw;
        }

        .study-wall {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    ellipse at 53% 43%,
                    #27231c 0%,
                    #151412 30%,
                    #0e0e0d 75%
                );
        }

        .study-floor {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 25vh;
            background:
                repeating-linear-gradient(
                    90deg,
                    #151311 0px,
                    #181613 90px,
                    #12110f 180px
                );
            border-top: 1px solid #27231e;
        }


        /* BOOKSHELF */

        .bookshelf {
            position: absolute;
            left: 2vw;
            bottom: 25vh;
            width: 15vw;
            height: 62vh;
            background: #171412;
            border: 1px solid #2c2722;
        }

        .shelf {
            position: absolute;
            left: 3%;
            right: 3%;
            height: 2%;
            background: #332c24;
        }

        .shelf.s1 { top: 17%; }
        .shelf.s2 { top: 34%; }
        .shelf.s3 { top: 51%; }
        .shelf.s4 { top: 68%; }
        .shelf.s5 { top: 85%; }

        .book {
            position: absolute;
            bottom: 2%;
            width: 7%;
            border: 1px solid #2d2822;
            cursor: pointer;
            opacity: 0.88;
        }

        .book:hover {
            opacity: 1;
        }

        .book.b1 { left: 7%; height: 14%; }
        .book.b2 { left: 15%; height: 15%; }
        .book.b3 { left: 23%; height: 13%; }
        .book.b4 { left: 31%; height: 16%; }
        .book.b5 { left: 39%; height: 14%; }
        .book.b6 { left: 47%; height: 15%; }
        .book.b7 { left: 55%; height: 13%; }
        .book.b8 { left: 63%; height: 16%; }
        .book.b9 { left: 71%; height: 14%; }
        .book.b10 { left: 79%; height: 15%; }
        .book.b11 { left: 87%; height: 13%; }

        .book-row-two {
            bottom: 36%;
        }

        .book-row-three {
            bottom: 53%;
        }

        .book-row-four {
            bottom: 70%;
        }

        .book-row-five {
            bottom: 87%;
        }


        /* ARMCHAIR */

        .armchair {
            position: absolute;
            left: 18vw;
            bottom: 25vh;
            width: 11vw;
            height: 27vh;
            background: #1d1a17;
            border: 1px solid #302b26;
            cursor: pointer;
        }

        .armchair::before {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 9%;
            height: 55%;
            background: #27231f;
            border: 1px solid #342f29;
        }

        .armchair::after {
            content: "";
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: -8%;
            height: 10%;
            background: #141311;
        }


        /* SIDE TABLE */

        .side-table {
            position: absolute;
            left: 30vw;
            bottom: 25vh;
            width: 6vw;
            height: 16vh;
            background: #1a1815;
            border: 1px solid #292621;
            cursor: pointer;
        }


        /* DESK */

        .study-desk {
            position: absolute;
            left: 34vw;
            bottom: 25vh;
            width: 17vw;
            height: 28vh;
            background: #1b1815;
            border: 1px solid #302a24;
        }

        .desk-top {
            position: absolute;
            left: -3%;
            top: -6%;
            width: 106%;
            height: 9%;
            background: #29231d;
        }

        .desk-leg {
            position: absolute;
            bottom: -35%;
            width: 8%;
            height: 37%;
            background: #141210;
        }

        .desk-leg.left {
            left: 7%;
        }

        .desk-leg.right {
            right: 7%;
        }


        /* DRAWERS */

        .desk-drawer {
            position: absolute;
            left: 8%;
            width: 84%;
            height: 17%;
            background: #151311;
            border: 1px solid #28231e;
            cursor: pointer;
        }

        .desk-drawer:hover {
            background: #1d1a16;
        }

        .desk-drawer.d1 {
            top: 19%;
        }

        .desk-drawer.d2 {
            top: 41%;
        }

        .desk-drawer.d3 {
            top: 63%;
        }

        .drawer-handle {
            position: absolute;
            left: 43%;
            top: 45%;
            width: 15%;
            height: 6%;
            background: #4a4237;
        }


        /* DESK ITEMS */

        .desk-bible {
            position: absolute;
            left: 4vw;
            top: -7vh;
            width: 5vw;
            height: 6vh;
            background: #27231d;
            border: 1px solid #3b342a;
            transform: rotate(-3deg);
            cursor: pointer;
        }

        .desk-journal {
            position: absolute;
            left: 10vw;
            top: -6vh;
            width: 5.5vw;
            height: 7vh;
            background: #332b23;
            border: 1px solid #4a3d30;
            transform: rotate(4deg);
            cursor: pointer;
            z-index: 5;
        }

        .desk-journal::after {
            content: "";
            position: absolute;
            left: 15%;
            top: 15%;
            width: 70%;
            height: 1px;
            background: #5a4c3d;
            box-shadow:
                0 8px #5a4c3d,
                0 16px #5a4c3d;
            opacity: 0.45;
        }

        .desk-paper {
            position: absolute;
            left: 7vw;
            top: -5vh;
            width: 5vw;
            height: 6vh;
            background: #c1b9a8;
            transform: rotate(-8deg);
            cursor: pointer;
            z-index: 4;
        }

        .desk-lamp {
            position: absolute;
            right: -2vw;
            top: -16vh;
            width: 4vw;
            height: 17vh;
            cursor: pointer;
        }

        .lamp-shade {
            position: absolute;
            top: 0;
            left: 0;
            width: 4vw;
            height: 6vh;
            background: #3a342b;
            clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
        }

        .lamp-stem {
            position: absolute;
            left: 48%;
            top: 35%;
            width: 4%;
            height: 55%;
            background: #494238;
        }


        /* FILING CABINET */

        .filing-cabinet {
            position: absolute;
            right: 5vw;
            bottom: 25vh;
            width: 9vw;
            height: 43vh;
            background: #191816;
            border: 1px solid #302d28;
            cursor: pointer;
        }

        .file-drawer {
            position: absolute;
            left: 7%;
            width: 86%;
            height: 18%;
            background: #131210;
            border: 1px solid #292621;
        }

        .file-drawer.fd1 { top: 8%; }
        .file-drawer.fd2 { top: 30%; }
        .file-drawer.fd3 { top: 52%; }
        .file-drawer.fd4 { top: 74%; }

        .file-handle {
            position: absolute;
            left: 39%;
            top: 45%;
            width: 22%;
            height: 5%;
            background: #4a443a;
        }


        /* CLOCK */

        .study-clock {
            position: absolute;
            right: 20vw;
            top: 13vh;
            width: 7vw;
            height: 7vw;
            border-radius: 50%;
            background: #1c1a17;
            border: 3px solid #37312a;
            cursor: pointer;
        }

        .clock-center {
            position: absolute;
            left: 47%;
            top: 47%;
            width: 6%;
            height: 6%;
            border-radius: 50%;
            background: #777066;
        }

        .clock-hand-one {
            position: absolute;
            left: 49%;
            top: 18%;
            width: 2%;
            height: 32%;
            background: #615a50;
            transform-origin: bottom;
            transform: rotate(0deg);
        }

        .clock-hand-two {
            position: absolute;
            left: 49%;
            top: 35%;
            width: 2%;
            height: 25%;
            background: #615a50;
            transform-origin: bottom;
            transform: rotate(95deg);
        }


        /* WASTEBASKET */

        .wastebasket {
            position: absolute;
            left: 53vw;
            bottom: 25vh;
            width: 4vw;
            height: 8vh;
            background: #181613;
            border: 1px solid #29251f;
            cursor: pointer;
        }


        /* =========================================================
           UI
        ========================================================= */

        #message-box {
            position: absolute;
            left: 50%;
            bottom: 7vh;
            transform: translateX(-50%);
            width: min(700px, 80vw);
            min-height: 65px;
            padding: 18px 25px;
            background: rgba(5, 5, 5, 0.93);
            border: 1px solid #28251f;
            color: #bdb8ae;
            text-align: center;
            line-height: 1.6;
            z-index: 50;
        }

        #message-box button {
            margin-top: 12px;
            background: none;
            border: none;
            color: #777168;
            cursor: pointer;
            letter-spacing: 0.12em;
        }

        #message-box button:hover {
            color: #b7b0a4;
        }


        /* =========================================================
           NOTES
        ========================================================= */

        #notes-button {
            position: absolute;
            top: 25px;
            right: 30px;
            z-index: 60;
            background: none;
            border: none;
            color: #676159;
            letter-spacing: 0.15em;
            cursor: pointer;
        }

        #notes-button:hover {
            color: #aaa39a;
        }

        #notes-overlay {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.96);
            padding: 8vh 15vw;
            overflow-y: auto;
        }

        #notes-overlay h2 {
            font-weight: normal;
            letter-spacing: 0.2em;
            color: #c4beb3;
        }

        #notes-list {
            margin-top: 40px;
            max-width: 700px;
        }

        .note-entry {
            padding: 17px 0;
            border-bottom: 1px solid #24221f;
            color: #99938a;
            line-height: 1.6;
        }

        #close-notes {
            margin-top: 35px;
            background: none;
            border: none;
            color: #716b62;
            cursor: pointer;
        }


        /* =========================================================
           EVIDENCE EXAMINATION
        ========================================================= */

        #evidence-overlay {
            position: absolute;
            inset: 0;
            z-index: 200;
            background: rgba(3, 3, 3, 0.97);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #evidence-interface {
            position: relative;
            width: 90vw;
            height: 88vh;
        }

        #evidence-title {
            position: absolute;
            top: 0;
            left: 0;
            color: #777168;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
        }

        #evidence-status {
            position: absolute;
            top: 0;
            right: 0;
            color: #625d55;
            font-size: 0.75rem;
        }


        /* JOURNAL */

        #journal-view {
            position: absolute;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            width: min(850px, 80vw);
            height: min(570px, 66vh);
            display: flex;
            perspective: 1200px;
        }

        .journal-page {
            position: relative;
            width: 50%;
            height: 100%;
            background:
                linear-gradient(
                    90deg,
                    #aaa18f 0%,
                    #c1b8a5 8%,
                    #c7bdab 100%
                );
            color: #3a352d;
            padding: 55px 50px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.55);
            overflow: hidden;
        }

        .journal-page.right {
            background:
                linear-gradient(
                    270deg,
                    #aaa18f 0%,
                    #c1b8a5 8%,
                    #c7bdab 100%
                );
        }

        .journal-page::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.15;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0,
                    transparent 27px,
                    #675f51 28px
                );
            pointer-events: none;
        }

        .journal-spine {
            position: absolute;
            left: 50%;
            top: 0;
            width: 12px;
            height: 100%;
            transform: translateX(-50%);
            background: #847a68;
            opacity: 0.7;
            z-index: 3;
        }

        .journal-writing {
            position: relative;
            z-index: 2;
            font-size: 1rem;
            line-height: 1.8;
            white-space: pre-line;
        }

        .journal-date {
            font-size: 0.8rem;
            margin-bottom: 35px;
            color: #61594e;
        }

        .journal-page-number {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #716858;
        }

        .journal-photo {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%) rotate(-3deg);
            width: 210px;
            height: 145px;
            background: #292826;
            border: 8px solid #d2c8b4;
            box-shadow: 0 6px 15px rgba(0,0,0,0.35);
            cursor: pointer;
            z-index: 5;
        }

        .journal-photo-inner {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    ellipse at 50% 40%,
                    #57534b,
                    #272623 55%,
                    #161616
                );
        }

        .photo-silhouette-one,
        .photo-silhouette-two {
            position: absolute;
            bottom: 10px;
            width: 45px;
            height: 75px;
            background: #171716;
            border-radius: 50% 50% 15% 15%;
        }

        .photo-silhouette-one {
            left: 38px;
        }

        .photo-silhouette-two {
            right: 38px;
        }


        /* CASE FILE */

        #case-file-view {
            position: absolute;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            width: min(850px, 82vw);
            height: min(600px, 70vh);
        }

        .case-folder {
            position: absolute;
            inset: 0;
            background: #777263;
            border: 1px solid #514d42;
            box-shadow: 0 20px 45px rgba(0,0,0,0.5);
        }

        .case-tab {
            position: absolute;
            top: -28px;
            left: 35px;
            width: 180px;
            height: 30px;
            background: #777263;
            border: 1px solid #514d42;
            border-bottom: none;
        }

        .case-paper {
            position: absolute;
            left: 6%;
            top: 7%;
            width: 88%;
            height: 86%;
            background: #c6bead;
            color: #3a362f;
            padding: 40px 50px;
            overflow: hidden;
        }

        .case-paper h3 {
            margin-top: 0;
            font-weight: normal;
            letter-spacing: 0.15em;
        }

        .case-paper p {
            line-height: 1.7;
        }

        .case-photo {
            float: right;
            width: 180px;
            height: 125px;
            margin: 0 0 20px 30px;
            background: #282724;
            border: 7px solid #e0d6c1;
            position: relative;
        }

        .case-photo::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    140deg,
                    #4c4942,
                    #171716
                );
        }


        /* EVIDENCE CONTROLS */

        #evidence-controls {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .evidence-control {
            background: none;
            border: none;
            color: #716b62;
            cursor: pointer;
            letter-spacing: 0.12em;
            padding: 10px 14px;
        }

        .evidence-control:hover {
            color: #b4aea3;
        }

        .evidence-control:disabled {
            color: #35322e;
            cursor: default;
        }


        /* =========================================================
           PHOTOGRAPH VIEWER
        ========================================================= */

        #photo-view {
            position: absolute;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            width: min(680px, 75vw);
            height: min(520px, 65vh);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #large-photo {
            position: relative;
            width: min(580px, 65vw);
            height: min(400px, 52vh);
            background: #252522;
            border: 18px solid #d1c7b3;
            box-shadow: 0 20px 50px rgba(0,0,0,0.65);
        }

        #large-photo-scene {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    #555149,
                    #292824 52%,
                    #151515
                );
        }

        #large-photo-scene::before {
            content: "";
            position: absolute;
            left: 27%;
            bottom: 12%;
            width: 80px;
            height: 170px;
            background: #161616;
            border-radius: 50% 50% 10% 10%;
        }

        #large-photo-scene::after {
            content: "";
            position: absolute;
            right: 25%;
            bottom: 12%;
            width: 80px;
            height: 170px;
            background: #1a1918;
            border-radius: 50% 50% 10% 10%;
        }


        /* =========================================================
           CONTROLS / CAMERA
        ========================================================= */

        #movement-hint {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #45413b;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            z-index: 40;
        }

    </style>
</head>


<body>


    <!-- =========================================================
         TITLE
    ========================================================= -->

    <div id="title-screen" class="screen">

        <h1>IN HIS NAME</h1>

        <p>A STORY OF FAITH</p>

        <button id="start-button">
            CLICK TO BEGIN
        </button>

    </div>


    <!-- =========================================================
         LOADING
    ========================================================= -->

    <div id="loading-screen" class="screen hidden">
        LOADING...
    </div>


    <!-- =========================================================
         STORY
    ========================================================= -->

    <div id="story-screen" class="screen hidden">
        <div id="story-text"></div>
    </div>


    <!-- =========================================================
         GAME
    ========================================================= -->

    <div id="game-screen" class="screen hidden">

        <div id="world">


            <!-- =====================================================
                 BEDROOM
            ===================================================== -->

            <div id="bedroom" class="room">

                <div class="room-wall"></div>
                <div class="room-floor"></div>


                <div
                    class="bed"
                    onclick="inspectBedroomObject('bed')"
                >
                    <div class="bed-mattress"></div>
                    <div class="bed-pillow"></div>
                    <div class="bed-frame"></div>
                </div>


                <div
                    class="nightstand"
                    onclick="inspectBedroomObject('nightstand')"
                >
                    <div class="nightstand-top"></div>
                </div>


                <div
                    class="cross"
                    onclick="inspectBedroomObject('cross')"
                ></div>


                <div
                    class="bedroom-picture"
                    onclick="inspectBedroomObject('picture')"
                ></div>


                <div
                    class="bedroom-door"
                    onclick="inspectBedroomObject('door')"
                >
                    <div class="bedroom-door-handle"></div>
                </div>

            </div>


            <!-- =====================================================
                 HALLWAY
            ===================================================== -->

            <div id="hallway" class="room">

                <div class="hallway-wall"></div>
                <div class="room-floor"></div>


                <div
                    class="hall-picture"
                    onclick="inspectHallwayPicture()"
                ></div>


                <div
                    class="hall-door one"
                    onclick="inspectHallDoor(1)"
                >
                    <div class="hall-door-handle"></div>
                </div>


                <div
                    class="hall-door two"
                    onclick="enterStudy()"
                >
                    <div class="hall-door-handle"></div>
                </div>


                <div class="hall-door three"></div>

            </div>


            <!-- =====================================================
                 STUDY
            ===================================================== -->

            <div id="study" class="room">

                <div class="study-wall"></div>
                <div class="study-floor"></div>


                <!-- BOOKSHELF -->

                <div class="bookshelf">

                    <div class="book b1" onclick="inspectBook(1)"></div>
                    <div class="book b2" onclick="inspectBook(2)"></div>
                    <div class="book b3" onclick="inspectBook(3)"></div>
                    <div class="book b4" onclick="inspectBook(4)"></div>
                    <div class="book b5" onclick="inspectBook(5)"></div>
                    <div class="book b6" onclick="inspectBook(6)"></div>
                    <div class="book b7" onclick="inspectBook(7)"></div>
                    <div class="book b8" onclick="inspectBook(8)"></div>
                    <div class="book b9" onclick="inspectBook(9)"></div>
                    <div class="book b10" onclick="inspectBook(10)"></div>
                    <div class="book b11" onclick="inspectBook(11)"></div>

                    <div class="shelf s1"></div>
                    <div class="shelf s2"></div>
                    <div class="shelf s3"></div>
                    <div class="shelf s4"></div>
                    <div class="shelf s5"></div>

                </div>


                <!-- ARMCHAIR -->

                <div
                    class="armchair"
                    onclick="inspectStudyObject('chair')"
                ></div>


                <!-- SIDE TABLE -->

                <div
                    class="side-table"
                    onclick="inspectStudyObject('sideTable')"
                ></div>


                <!-- DESK -->

                <div class="study-desk">

                    <div class="desk-top"></div>

                    <div
                        class="desk-drawer d1"
                        onclick="inspectDrawer(1, event)"
                    >
                        <div class="drawer-handle"></div>
                    </div>

                    <div
                        class="desk-drawer d2"
                        onclick="inspectDrawer(2, event)"
                    >
                        <div class="drawer-handle"></div>
                    </div>

                    <div
                        class="desk-drawer d3"
                        onclick="inspectDrawer(3, event)"
                    >
                        <div class="drawer-handle"></div>
                    </div>

                    <div class="desk-leg left"></div>
                    <div class="desk-leg right"></div>


                    <div
                        class="desk-bible"
                        onclick="inspectStudyObject('bible', event)"
                    ></div>


                    <div
                        class="desk-journal"
                        onclick="openJournal(event)"
                    ></div>


                    <div
                        class="desk-paper"
                        onclick="inspectStudyObject('paper', event)"
                    ></div>


                    <div
                        class="desk-lamp"
                        onclick="inspectStudyObject('lamp', event)"
                    >
                        <div class="lamp-shade"></div>
                        <div class="lamp-stem"></div>
                    </div>

                </div>


                <!-- FILING CABINET -->

                <div
                    class="filing-cabinet"
                    onclick="inspectFilingCabinet()"
                >

                    <div class="file-drawer fd1">
                        <div class="file-handle"></div>
                    </div>

                    <div class="file-drawer fd2">
                        <div class="file-handle"></div>
                    </div>

                    <div class="file-drawer fd3">
                        <div class="file-handle"></div>
                    </div>

                    <div class="file-drawer fd4">
                        <div class="file-handle"></div>
                    </div>

                </div>


                <!-- CLOCK -->

                <div
                    class="study-clock"
                    onclick="inspectStudyObject('clock')"
                >
                    <div class="clock-hand-one"></div>
                    <div class="clock-hand-two"></div>
                    <div class="clock-center"></div>
                </div>


                <!-- WASTEBASKET -->

                <div
                    class="wastebasket"
                    onclick="inspectStudyObject('wastebasket')"
                ></div>

            </div>

        </div>


        <!-- UI -->

        <button
            id="notes-button"
            onclick="openNotes()"
        >
            [ NOTES ]
        </button>


        <div id="message-box" class="hidden">
            <div id="message-text"></div>

            <button onclick="closeMessage()">
                [ CLOSE ]
            </button>
        </div>


        <div id="movement-hint">
            ← → MOVE
        </div>

    </div>


    <!-- =========================================================
         NOTES OVERLAY
    ========================================================= -->

    <div id="notes-overlay" class="hidden">

        <h2>NOTES</h2>

        <div id="notes-list"></div>

        <button id="close-notes" onclick="closeNotes()">
            [ CLOSE NOTES ]
        </button>

    </div>


    <!-- =========================================================
         EVIDENCE OVERLAY
    ========================================================= -->

    <div id="evidence-overlay" class="hidden">

        <div id="evidence-interface">

            <div id="evidence-title">
                EVIDENCE
            </div>

            <div id="evidence-status"></div>


            <!-- JOURNAL -->

            <div id="journal-view" class="hidden">

                <div class="journal-page">

                    <div
                        id="journal-left-content"
                        class="journal-writing"
                    ></div>

                    <div
                        id="journal-left-number"
                        class="journal-page-number"
                    ></div>

                </div>


                <div class="journal-spine"></div>


                <div class="journal-page right">

                    <div
                        id="journal-right-content"
                        class="journal-writing"
                    ></div>

                    <div
                        id="journal-right-number"
                        class="journal-page-number"
                    ></div>

                </div>

            </div>


            <!-- CASE FILE -->

            <div id="case-file-view" class="hidden">

                <div class="case-folder">

                    <div class="case-tab"></div>

                    <div class="case-paper">

                        <div class="case-photo"></div>

                        <h3 id="case-file-heading">
                            CASE FILE
                        </h3>

                        <p id="case-file-content"></p>

                    </div>

                </div>

            </div>


            <!-- PHOTO -->

            <div id="photo-view" class="hidden">

                <div id="large-photo">

                    <div id="large-photo-scene"></div>

                </div>

            </div>


            <!-- CONTROLS -->

            <div id="evidence-controls">

                <button
                    id="previous-page"
                    class="evidence-control"
                    onclick="previousJournalPage()"
                >
                    [ ← PREVIOUS ]
                </button>

                <button
                    id="next-page"
                    class="evidence-control"
                    onclick="nextJournalPage()"
                >
                    [ NEXT → ]
                </button>

                <button
                    id="evidence-photo-button"
                    class="evidence-control hidden"
                    onclick="openEvidencePhoto()"
                >
                    [ EXAMINE PHOTO ]
                </button>

                <button
                    id="put-down-evidence"
                    class="evidence-control"
                    onclick="closeEvidence()"
                >
                    [ PUT DOWN ]
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================================================
           GAME STATE
        ========================================================= */

        const state = {

            room: "bedroom",

            cameraPosition: 0,

            bedroomInspected: {
                bed: false,
                nightstand: false,
                cross: false,
                picture: false,
                door: false
            },

            notes: [],

            study: {

                journalFound: false,
                journalOpened: false,

                journalPage: 0,

                photoFound: false,

                cabinetOpened: false,

                drawers: {
                    one: false,
                    two: false,
                    three: false
                },

                clockChanged: false
            },

            evidence: {
                open: false,
                type: null
            }

        };


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const titleScreen =
            document.getElementById("title-screen");

        const loadingScreen =
            document.getElementById("loading-screen");

        const storyScreen =
            document.getElementById("story-screen");

        const storyText =
            document.getElementById("story-text");

        const gameScreen =
            document.getElementById("game-screen");

        const world =
            document.getElementById("world");

        const messageBox =
            document.getElementById("message-box");

        const messageText =
            document.getElementById("message-text");

        const notesOverlay =
            document.getElementById("notes-overlay");

        const notesList =
            document.getElementById("notes-list");

        const evidenceOverlay =
            document.getElementById("evidence-overlay");

        const evidenceTitle =
            document.getElementById("evidence-title");

        const evidenceStatus =
            document.getElementById("evidence-status");

        const journalView =
            document.getElementById("journal-view");

        const caseFileView =
            document.getElementById("case-file-view");

        const photoView =
            document.getElementById("photo-view");


        /* =========================================================
           START
        ========================================================= */

        document
            .getElementById("start-button")
            .addEventListener("click", startGame);


        function startGame() {

            titleScreen.classList.add("hidden");

            loadingScreen.classList.remove("hidden");

            setTimeout(() => {

                loadingScreen.classList.add("hidden");

                storyScreen.classList.remove("hidden");

                playIntro();

            }, 1500);

        }


        /* =========================================================
           INTRO
        ========================================================= */

        function playIntro() {

            const lines = [

                "You awaken.",

                "It is still dark.",

                "You cannot remember falling asleep.",

                "Something is breathing nearby."

            ];

            let index = 0;

            function nextLine() {

                if (index >= lines.length) {

                    setTimeout(() => {

                        storyScreen.classList.add("hidden");

                        gameScreen.classList.remove("hidden");

                    }, 900);

                    return;
                }

                storyText.textContent = lines[index];

                index++;

                setTimeout(nextLine, 1900);
            }

            nextLine();

        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        function showMessage(text) {

            messageText.textContent = text;

            messageBox.classList.remove("hidden");

        }


        function closeMessage() {

            messageBox.classList.add("hidden");

        }


        /* =========================================================
           NOTES
        ========================================================= */

        function addNote(text) {

            if (state.notes.includes(text)) {
                return;
            }

            state.notes.push(text);

        }


        function openNotes() {

            if (state.evidence.open) {
                return;
            }

            renderNotes();

            notesOverlay.classList.remove("hidden");

        }


        function closeNotes() {

            notesOverlay.classList.add("hidden");

        }


        function renderNotes() {

            notesList.innerHTML = "";

            if (state.notes.length === 0) {

                notesList.innerHTML =
                    '<div class="note-entry">Nothing yet.</div>';

                return;
            }

            state.notes.forEach(note => {

                const entry =
                    document.createElement("div");

                entry.className = "note-entry";

                entry.textContent = note;

                notesList.appendChild(entry);

            });

        }


        /* =========================================================
           BEDROOM
        ========================================================= */

        function inspectBedroomObject(object) {

            if (object === "bed") {

                state.bedroomInspected.bed = true;

                showMessage(
                    "The sheets are cold."
                );

                addNote(
                    "The sheets are cold. You don't remember leaving the bed."
                );

            }


            if (object === "nightstand") {

                state.bedroomInspected.nightstand = true;

                showMessage(
                    "Nothing."
                );

                addNote(
                    "The nightstand is empty."
                );

            }


            if (object === "cross") {

                state.bedroomInspected.cross = true;

                showMessage(
                    "A wooden cross."
                );

                addNote(
                    "A wooden cross hangs on the wall."
                );

            }


            if (object === "picture") {

                state.bedroomInspected.picture = true;

                if (
                    state.bedroomInspected.picture &&
                    state.bedroomInspected.bed
                ) {

                    showMessage(
                        "A dark old photograph. The face is familiar."
                    );

                } else {

                    showMessage(
                        "An old photograph."
                    );

                }

                addNote(
                    "There is an old photograph in the bedroom. The face feels familiar."
                );

            }


            if (object === "door") {

                const allInspected =
                    Object.values(state.bedroomInspected)
                        .every(Boolean);

                if (!allInspected) {

                    showMessage(
                        "Locked."
                    );

                    return;

                }

                showMessage(
                    "The handle turns."
                );

                setTimeout(() => {

                    closeMessage();

                    moveToRoom("hallway");

                }, 900);

            }

        }


        /* =========================================================
           HALLWAY
        ========================================================= */

        function inspectHallDoor(number) {

            if (number === 1) {

                showMessage(
                    "Locked."
                );

            }

        }


        function inspectHallwayPicture() {

            if (state.bedroomInspected.picture) {

                showMessage(
                    "That face..."
                );

                setTimeout(() => {

                    showMessage(
                        "You've seen it before."
                    );

                }, 1800);

                addNote(
                    "The face in the hallway picture feels familiar."
                );

            } else {

                showMessage(
                    "You can barely make out a man in the picture."
                );

            }

        }


        /* =========================================================
           MOVEMENT
        ========================================================= */

        function moveToRoom(room) {

            if (room === "bedroom") {

                state.room = "bedroom";

                state.cameraPosition = 0;

                world.style.left = "0vw";

            }

            if (room === "hallway") {

                state.room = "hallway";

                state.cameraPosition = 1;

                world.style.left = "-60vw";

            }

            if (room === "study") {

                state.room = "study";

                state.cameraPosition = 2;

                world.style.left = "-120vw";

            }

        }


        function enterStudy() {

            moveToRoom("study");

            showMessage(
                "A study."
            );

        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    state.evidence.open ||
                    !notesOverlay.classList.contains("hidden")
                ) {
                    return;
                }

                if (event.key === "ArrowRight") {

                    if (state.room === "bedroom") {

                        moveToRoom("hallway");

                    } else if (state.room === "hallway") {

                        moveToRoom("study");

                    }

                }


                if (event.key === "ArrowLeft") {

                    if (state.room === "study") {

                        moveToRoom("hallway");

                    } else if (state.room === "hallway") {

                        moveToRoom("bedroom");

                    }

                }

            }
        );


        /* =========================================================
           STUDY — ORDINARY OBJECTS
        ========================================================= */

        function inspectStudyObject(object) {

            if (object === "chair") {

                showMessage(
                    "The chair looks recently used."
                );

                return;
            }


            if (object === "sideTable") {

                showMessage(
                    "A layer of dust covers the table."
                );

                return;
            }


            if (object === "bible") {

                showMessage(
                    "A worn Bible. Someone has underlined several passages."
                );

                addNote(
                    "The Bible is worn from use. Someone underlined passages throughout it."
                );

                return;
            }


            if (object === "paper") {

                showMessage(
                    "A handwritten reminder: 2:30 — pick him up."
                );

                addNote(
                    "A piece of paper on the desk reads: \"2:30 — pick him up.\" There is no name."
                );

                return;
            }


            if (object === "lamp") {

                showMessage(
                    "The lamp doesn't work."
                );

                return;
            }


            if (object === "clock") {

                if (!state.study.clockChanged) {

                    showMessage(
                        "The clock has stopped at 3:17."
                    );

                    addNote(
                        "The study clock is stopped at 3:17."
                    );

                } else {

                    showMessage(
                        "3:18."
                    );

                }

                return;
            }


            if (object === "wastebasket") {

                showMessage(
                    "Torn pieces of paper."
                );

                addNote(
                    "There are torn-up papers in the wastebasket."
                );

            }

        }


        /* =========================================================
           BOOKS
        ========================================================= */

        const books = {

            1:
                "The Cost of Discipleship. The pages are worn.",

            2:
                "Mere Christianity. Someone folded a corner.",

            3:
                "A commentary on Romans. Several passages are underlined.",

            4:
                "A book of Psalms. There is a pressed flower between the pages.",

            5:
                "An old Tennessee history book.",

            6:
                "A dictionary. The spine is nearly broken.",

            7:
                "A book of poetry. You don't recognize the handwriting in the margins.",

            8:
                "A gardening book. Nothing seems unusual.",

            9:
                "An astronomy book. The pages smell like dust.",

            10:
                "An old paperback novel. You don't remember owning it.",

            11:
                "A prayer book. Someone has written something inside the cover."

        };


        function inspectBook(number) {

            showMessage(
                books[number] || "An old book."
            );

            if (number === 3) {

                addNote(
                    "The study contains a heavily annotated commentary on Romans."
                );

            }

            if (number === 7) {

                addNote(
                    "There are handwritten notes in the margins of a poetry book."
                );

            }

            if (number === 11) {

                addNote(
                    "A prayer book contains handwriting inside the cover."
                );

            }

        }


        /* =========================================================
           SPECIAL BOOK / HIDDEN CLUE
        ========================================================= */

        /*
            The shelf will eventually contain a visually distinct
            special book. For now the evidence system is ready for it.

            The name fragment is deliberately:

                jul-

            and NOT:

                Juli—

            The player should not immediately know it is Julian.
        */


        /* =========================================================
           DESK DRAWERS
        ========================================================= */

        function inspectDrawer(number, event) {

            if (event) {
                event.stopPropagation();
            }


            if (number === 1) {

                if (!state.study.drawers.one) {

                    state.study.drawers.one = true;

                    showMessage(
                        "Pens. Batteries. Receipts."
                    );

                } else {

                    showMessage(
                        "Nothing else."
                    );

                }

                return;
            }


            if (number === 2) {

                if (!state.study.drawers.two) {

                    state.study.drawers.two = true;

                    showMessage(
                        "Old letters. The handwriting is familiar."
                    );

                    addNote(
                        "Old letters are kept in the desk. The handwriting looks familiar, but you can't place it."
                    );

                } else {

                    showMessage(
                        "The same old letters."
                    );

                }

                return;
            }


            if (number === 3) {

                if (!state.study.drawers.three) {

                    state.study.drawers.three = true;

                    showMessage(
                        "Locked."
                    );

                    addNote(
                        "The bottom desk drawer is locked. Something is inside."
                    );

                } else {

                    showMessage(
                        "Still locked."
                    );

                }

            }

        }


        /* =========================================================
           FILING CABINET
        ========================================================= */

        function inspectFilingCabinet() {

            if (!state.study.cabinetOpened) {

                state.study.cabinetOpened = true;

                showMessage(
                    "Old family records."
                );

                addNote(
                    "The filing cabinet contains old family records."
                );

                setTimeout(() => {

                    showMessage(
                        "One folder is marked D / J."
                    );

                    addNote(
                        "A folder in the filing cabinet is marked \"D / J.\""
                    );

                }, 1800);

            } else {

                showMessage(
                    "The folder marked D / J is empty."
                );

                addNote(
                    "The D / J folder is empty. Someone has written \"He knows.\" underneath it."
                );

            }

        }


        /* =========================================================
           JOURNAL
        ========================================================= */

        const journalPages = [

            {
                left:
                    "There is nothing written here.",

                right:
                    "The first few pages have been torn out.",

                leftNumber:
                    "—",

                rightNumber:
                    "—"
            },


            {
                left:
                    "June 19\n\nHe said he wasn't afraid of me.\n\nI believed him.",

                right:
                    "I don't know why I keep writing this down.\n\nI told myself it would make sense later.\n\njul-\n\n[The rest has been scratched away.]",

                leftNumber:
                    "14",

                rightNumber:
                    "15"
            },


            {
                left:
                    "I shouldn't have—\n\n[The rest of the page has been torn away.]",

                right:
                    "There are several lines written so heavily that the paper has nearly torn.\n\nYou can't make them out.",

                leftNumber:
                    "16",

                rightNumber:
                    "17"
            },


            {
                left:
                    "A photograph has been kept between these pages.",

                right:
                    "The photograph is stuck to the page.\n\nSomeone has written something on the back.",

                leftNumber:
                    "18",

                rightNumber:
                    "19",

                photo: true
            }

        ];


        function openJournal(event) {

            if (event) {
                event.stopPropagation();
            }

            closeMessage();

            state.study.journalFound = true;
            state.study.journalOpened = true;
            state.study.journalPage = 0;

            addNote(
                "You found an old journal. The handwriting looks like yours."
            );

            addNote(
                "One entry contains the fragment \"jul-\". The rest is unreadable."
            );

            openEvidence("journal");

        }


        function openEvidence(type) {

            state.evidence.open = true;
            state.evidence.type = type;

            evidenceOverlay.classList.remove("hidden");

            journalView.classList.add("hidden");
            caseFileView.classList.add("hidden");
            photoView.classList.add("hidden");

            document
                .getElementById("evidence-photo-button")
                .classList.add("hidden");


            if (type === "journal") {

                evidenceTitle.textContent =
                    "JOURNAL";

                journalView.classList.remove("hidden");

                renderJournal();

            }


            if (type === "case-file") {

                evidenceTitle.textContent =
                    "CASE FILE";

                caseFileView.classList.remove("hidden");

                renderCaseFile();

            }


            if (type === "photo") {

                evidenceTitle.textContent =
                    "PHOTOGRAPH";

                photoView.classList.remove("hidden");

                document
                    .getElementById("previous-page")
                    .classList.add("hidden");

                document
                    .getElementById("next-page")
                    .classList.add("hidden");

            }

        }


        /* =========================================================
           JOURNAL RENDERING
        ========================================================= */

        function renderJournal() {

            const page =
                journalPages[state.study.journalPage];

            document
                .getElementById("journal-left-content")
                .textContent = page.left;

            document
                .getElementById("journal-right-content")
                .textContent = page.right;

            document
                .getElementById("journal-left-number")
                .textContent = page.leftNumber;

            document
                .getElementById("journal-right-number")
                .textContent = page.rightNumber;


            evidenceStatus.textContent =
                "PAGES " +
                (state.study.journalPage * 2 + 1) +
                "–" +
                (state.study.journalPage * 2 + 2);


            const previous =
                document.getElementById("previous-page");

            const next =
                document.getElementById("next-page");

            previous.disabled =
                state.study.journalPage === 0;

            next.disabled =
                state.study.journalPage ===
                journalPages.length - 1;


            if (page.photo) {

                document
                    .getElementById("evidence-photo-button")
                    .classList.remove("hidden");

            } else {

                document
                    .getElementById("evidence-photo-button")
                    .classList.add("hidden");

            }

        }


        function nextJournalPage() {

            if (
                state.evidence.type !== "journal"
            ) {
                return;
            }

            if (
                state.study.journalPage >=
                journalPages.length - 1
            ) {
                return;
            }

            state.study.journalPage++;

            renderJournal();


            if (state.study.journalPage === 1) {

                addNote(
                    "The journal contains an entry dated June 19."
                );

            }


            if (state.study.journalPage === 2) {

                addNote(
                    "A journal page begins: \"I shouldn't have—\" before being torn away."
                );

            }


            if (state.study.journalPage === 3) {

                state.study.photoFound = true;

                addNote(
                    "A photograph is hidden inside the journal."
                );

            }

        }


        function previousJournalPage() {

            if (
                state.evidence.type !== "journal"
            ) {
                return;
            }

            if (state.study.journalPage <= 0) {
                return;
            }

            state.study.journalPage--;

            renderJournal();

        }


        /* =========================================================
           JOURNAL PHOTO
        ========================================================= */

        function openEvidencePhoto() {

            if (
                state.evidence.type !== "journal"
            ) {
                return;
            }

            state.evidence.type = "photo";

            journalView.classList.add("hidden");

            photoView.classList.remove("hidden");

            evidenceTitle.textContent =
                "PHOTOGRAPH";

            evidenceStatus.textContent =
                "FOUND INSIDE JOURNAL";

            document
                .getElementById("previous-page")
                .classList.add("hidden");

            document
                .getElementById("next-page")
                .classList.add("hidden");

            document
                .getElementById("evidence-photo-button")
                .classList.add("hidden");

            addNote(
                "The photograph shows Dontay with another boy. You don't recognize him."
            );

        }


        /* =========================================================
           CASE FILE SYSTEM
        ========================================================= */

        function openCaseFile() {

            closeMessage();

            openEvidence("case-file");

        }


        function renderCaseFile() {

            evidenceStatus.textContent =
                "FILE D / J";

            document
                .getElementById("case-file-heading")
                .textContent =
                "D / J";

            document
                .getElementById("case-file-content")
                .textContent =
                "The folder contains several old documents. " +
                "Most are ordinary records. One photograph has been attached to the file. " +
                "The names on the paperwork have faded with age.";

            document
                .getElementById("previous-page")
                .classList.add("hidden");

            document
                .getElementById("next-page")
                .classList.add("hidden");

            document
                .getElementById("evidence-photo-button")
                .classList.remove("hidden");

        }


        /* =========================================================
           CLOSE / PUT DOWN EVIDENCE
        ========================================================= */

        function closeEvidence() {

            state.evidence.open = false;
            state.evidence.type = null;

            state.study.journalOpened = false;

            evidenceOverlay.classList.add("hidden");

            journalView.classList.add("hidden");
            caseFileView.classList.add("hidden");
            photoView.classList.add("hidden");

            document
                .getElementById("previous-page")
                .classList.remove("hidden");

            document
                .getElementById("next-page")
                .classList.remove("hidden");

        }


        /* =========================================================
           KEYBOARD EVIDENCE CONTROLS
        ========================================================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (!state.evidence.open) {
                    return;
                }


                if (
                    state.evidence.type === "journal"
                ) {

                    if (event.key === "ArrowRight") {

                        nextJournalPage();

                    }

                    if (event.key === "ArrowLeft") {

                        previousJournalPage();

                    }

                }


                if (event.key === "Escape") {

                    closeEvidence();

                }

            }
        );


        /* =========================================================
           FUTURE CASE-FILE HOOK
        =========================================================

           The case-file system is deliberately separate from the
           journal system.

           Later, when the player physically discovers the case file,
           we can simply call:

               openCaseFile();

           That will open the actual evidence interface instead of
           showing a normal message.

        ========================================================= */


        /* =========================================================
           INITIAL STATE
        ========================================================= */

        moveToRoom("bedroom");

    </script>

</body>
</html>
