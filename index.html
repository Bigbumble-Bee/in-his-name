<!DOCTYPE html>
<html>

<head>
    <title>In His Name</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: #c9c4b8;
            font-family: Georgia, serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-screen {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 10px;
            margin: 0;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 4px;
            color: #77736b;
        }

        .start {
            margin-top: 80px;
            font-size: 16px;
            letter-spacing: 3px;
            color: #aaa59a;
            background: none;
            border: none;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        .start:hover {
            color: #ffffff;
        }

        .loading-screen {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        .loading-screen p {
            font-size: 14px;
            letter-spacing: 5px;
            color: #77736b;
        }

        .game-screen {
            text-align: center;
            width: 80%;
            animation: fadeIn 2s ease-in-out;
        }

        .game-screen p {
            font-size: 18px;
            letter-spacing: 3px;
            color: #aaa59a;
            line-height: 2;
        }

        .fade-out {
            animation: fadeOut 1s ease-in-out forwards;
        }

        .black-screen {
            background: #000000;
            width: 100vw;
            height: 100vh;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="title-screen">

        <h1>IN HIS NAME</h1>

        <div class="subtitle">
            A STORY OF FAITH
        </div>

        <button class="start" onclick="beginGame()">
            [ CLICK TO BEGIN ]
        </button>

    </div>

    <script>
        function beginGame() {

            document.body.innerHTML = `
                <div class="loading-screen">
                    <p>LOADING...</p>
                </div>
            `;

            setTimeout(function() {

                showStory("You awaken.", function() {

                    showStory("It is still dark.", function() {

                        showStory("You cannot remember falling asleep.", function() {

                            showStory("Something is breathing nearby.", function() {

                                document.body.innerHTML = `
                                    <div class="black-screen"></div>
                                `;

                            });

                        });

                    });

                });

            }, 5000);
        }


        function showStory(text, next) {

            document.body.innerHTML = `
                <div class="game-screen" id="story">
                    <p>${text}</p>
                </div>
            `;

            setTimeout(function() {

                const story = document.getElementById("story");

                story.classList.add("fade-out");

                setTimeout(function() {

                    if (next) {
                        next();
                    }

                }, 1000);

            }, 3000);
        }
    </script>

</body>

</html>
