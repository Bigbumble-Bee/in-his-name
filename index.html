<!DOCTYPE html>
<html>

<head>
    <title>In His Name</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #c9c4b8;
            font-family: Georgia, serif;
            height: 100vh;
            overflow: hidden;
        }


        /* =========================
           TITLE SCREEN
        ========================= */

        .title-screen {
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .title-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 10px;
            margin: 0;
        }

        .subtitle {
            margin-top: 20px;

            font-size: 14px;
            letter-spacing: 4px;

            color: #77736b;
        }

        .start {
            margin-top: 80px;

            font-size: 16px;
            letter-spacing: 3px;

            color: #aaa59a;

            background: none;
            border: none;

            font-family: Georgia, serif;

            cursor: pointer;
        }

        .start:hover {
            color: #ffffff;
        }


        /* =========================
           LOADING
        ========================= */

        .loading-screen {
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading-screen p {
            font-size: 14px;
            letter-spacing: 5px;

            color: #77736b;
        }


        /* =========================
           STORY
        ========================= */

        .game-screen {
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .game-screen p {
            font-size: 18px;
            letter-spacing: 3px;

            color: #aaa59a;

            line-height: 2;
        }

        .black-screen {
            width: 100vw;
            height: 100vh;

            background: #000000;
        }


        /* =========================
           CAMERA
        ========================= */

        .room-window {
            width: 100vw;
            height: 100vh;

            position: relative;

            overflow: hidden;
        }

        .room {
            width: 180vw;
            height: 100vh;

            position: absolute;

            top: 0;
            left: -40vw;

            background: #090909;

            transition: left 0.7s ease;
        }


        /* =========================
           WALL
        ========================= */

        .back-wall {
            position: absolute;

            top: 0;
            left: 0;

            width: 180vw;
            height: 68vh;

            background: #090909;

            border-bottom: 1px solid #1c1b19;
        }


        /* =========================
           LIGHT
        ========================= */

        .wall-light {
            position: absolute;

            width: 500px;
            height: 300px;

            top: 25vh;
            left: 90vw;

            transform: translateX(-50%);

            background: #8f8979;

            filter: blur(80px);

            opacity: 0.035;
        }

        .light {
            position: absolute;

            width: 220px;
            height: 220px;

            top: 45vh;
            left: 90vw;

            transform: translate(-50%, -50%);

            background: #b8b29f;

            border-radius: 50%;

            filter: blur(45px);

            opacity: 0.12;
        }


        /* =========================
           FLOOR
        ========================= */

        .floor {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 180vw;
            height: 32vh;

            background: #11100f;

            border-top: 1px solid #1c1b19;
        }


        /* =========================
           DOOR
        ========================= */

        .door {
            position: absolute;

            width: 16vw;
            height: 45vh;

            left: 136vw;
            bottom: 32vh;

            background: #11100f;

            border: 1px solid #24211d;

            cursor: pointer;
        }

        .door:hover {
            border-color: #3a352d;
        }

        .door-knob {
            position: absolute;

            width: 8px;
            height: 8px;

            right: 12%;
            top: 52%;

            border-radius: 50%;

            background: #4a463d;
        }


        /* =========================
           BED
        ========================= */

        .bed {
            position: absolute;

            width: 55vw;
            height: 20vh;

            left: 40vw;
            bottom: 22vh;

            background: #191816;

            border: 1px solid #2b2823;

            box-shadow:
                0 -8px 25px rgba(0, 0, 0, 0.4);

            cursor: pointer;
        }

        .bed:hover {
            border-color: #3a352d;
        }


        /* =========================
           PILLOW
        ========================= */

        .pillow {
            position: absolute;

            width: 22%;
            height: 35%;

            left: 5%;
            top: 15%;

            background: #211f1c;

            border: 1px solid #302c26;
        }


        /* =========================
           BLANKET
        ========================= */

        .blanket {
            position: absolute;

            width: 65%;
            height: 70%;

            right: 5%;
            top: 15%;

            background: #171513;

            border: 1px solid #211e1a;
        }


        /* =========================
           NIGHTSTAND
        ========================= */

        .nightstand {
            position: absolute;

            width: 10vw;
            height: 15vh;

            left: 16vw;
            bottom: 32vh;

            background: #121110;

            border: 1px solid #211f1c;

            cursor: pointer;
        }

        .nightstand:hover {
            border-color: #3a352d;
        }

        .drawer {
            position: absolute;

            width: 70%;
            height: 25%;

            left: 15%;
            top: 20%;

            border: 1px solid #27241f;
        }


        /* =========================
           CRUCIFIX
        ========================= */

        .cross {
            position: absolute;

            width: 50px;
            height: 90px;

            left: 62vw;
            top: 18vh;

            cursor: pointer;
        }

        .cross::before {
            content: "";

            position: absolute;

            width: 8px;
            height: 90px;

            left: 21px;
            top: 0;

            background: #25221e;
        }

        .cross::after {
            content: "";

            position: absolute;

            width: 50px;
            height: 8px;

            left: 0;
            top: 28px;

            background: #25221e;
        }

        .cross:hover::before,
        .cross:hover::after {
            background: #3a352d;
        }


        /* =========================
           PICTURE
        ========================= */

        .picture {
            position: absolute;

            width: 12vw;
            height: 16vh;

            left: 16vw;
            top: 14vh;

            border: 3px solid #25221e;

            background: #11100f;

            cursor: pointer;
        }

        .picture:hover {
            border-color: #3a352d;
        }

        .picture-inner {
            position: absolute;

            width: 70%;
            height: 70%;

            left: 15%;
            top: 15%;

            background: #171614;
        }


        /* =========================
           MESSAGE
        ========================= */

        .interaction-message {
            position: fixed;

            bottom: 10%;
            left: 50%;

            transform: translateX(-50%);

            color: #aaa59a;

            font-size: 16px;
            letter-spacing: 2px;

            opacity: 0;

            transition: opacity 0.5s ease;

            pointer-events: none;

            white-space: nowrap;

            z-index: 10;
        }

        .interaction-message.visible {
            opacity: 1;
        }


        /* =========================
           MOVEMENT HINT
        ========================= */

        .movement-hint {
            position: fixed;

            bottom: 4%;
            left: 50%;

            transform: translateX(-50%);

            color: #5f5b53;

            font-size: 12px;
            letter-spacing: 2px;

            pointer-events: none;

            z-index: 10;
        }


        /* =========================
           FADE
        ========================= */

        .fade-out {
            animation: fadeOut 1s ease-in-out forwards;
        }

        @keyframes fadeOut {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         TITLE
    ========================= -->

    <div class="title-screen">

        <div class="title-content">

            <h1>IN HIS NAME</h1>

            <div class="subtitle">
                A STORY OF FAITH
            </div>

            <button
                class="start"
                onclick="beginGame()">

                [ CLICK TO BEGIN ]

            </button>

        </div>

    </div>


    <script>


        /* =========================
           GAME STATE
        ========================= */

        let inspectedObjects = {

            bed: false,

            nightstand: false,

            cross: false,

            picture: false,

            door: false

        };


        let firstEventTriggered = false;


        let roomPosition = -40;


        /* =========================
           BEGIN GAME
        ========================= */

        function beginGame() {

            document.body.innerHTML = `

                <div class="loading-screen">

                    <p>LOADING...</p>

                </div>

            `;


            setTimeout(function() {

                showStory(
                    "You awaken.",
                    function() {

                        showStory(
                            "It is still dark.",
                            function() {

                                showStory(
                                    "You cannot remember falling asleep.",
                                    function() {

                                        showStory(
                                            "Something is breathing nearby.",
                                            function() {

                                                document.body.innerHTML = `

                                                    <div class="black-screen"></div>

                                                `;


                                                setTimeout(function() {

                                                    showRoom();

                                                }, 2000);

                                            }
                                        );

                                    }
                                );

                            }
                        );

                    }
                );

            }, 5000);

        }


        /* =========================
           STORY
        ========================= */

        function showStory(text, next) {

            document.body.innerHTML = `

                <div
                    class="game-screen"
                    id="story">

                    <p>${text}</p>

                </div>

            `;


            setTimeout(function() {

                const story =
                    document.getElementById("story");


                story.classList.add("fade-out");


                setTimeout(function() {

                    if (next) {

                        next();

                    }

                }, 1000);


            }, 3000);

        }


        /* =========================
           ROOM
        ========================= */

        function showRoom() {

            document.body.innerHTML = `

                <div class="room-window">


                    <div
                        class="room"
                        id="room">


                        <div class="back-wall"></div>


                        <div class="wall-light"></div>


                        <div class="light"></div>


                        <div class="floor"></div>


                        <div
                            class="picture"
                            onclick="inspectPicture()">

                            <div class="picture-inner"></div>

                        </div>


                        <div
                            class="cross"
                            onclick="inspectCross()">
                        </div>


                        <div
                            class="nightstand"
                            onclick="inspectNightstand()">

                            <div class="drawer"></div>

                        </div>


                        <div
                            class="door"
                            onclick="inspectDoor()">

                            <div class="door-knob"></div>

                        </div>


                        <div
                            class="bed"
                            onclick="inspectBed()">

                            <div class="pillow"></div>

                            <div class="blanket"></div>

                        </div>


                    </div>


                    <div
                        class="interaction-message"
                        id="interactionMessage">
                    </div>


                    <div class="movement-hint">

                        [ ← → ] LOOK AROUND

                    </div>


                </div>

            `;

        }


        /* =========================
           CAMERA MOVEMENT
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {


                const room =
                    document.getElementById("room");


                if (!room) {

                    return;

                }


                if (event.key === "ArrowLeft") {

                    roomPosition += 15;


                    if (roomPosition > 0) {

                        roomPosition = 0;

                    }


                    room.style.left =
                        roomPosition + "vw";

                }


                if (event.key === "ArrowRight") {

                    roomPosition -= 15;


                    if (roomPosition < -80) {

                        roomPosition = -80;

                    }


                    room.style.left =
                        roomPosition + "vw";

                }

            }
        );


        /* =========================
           MESSAGE
        ========================= */

        function showMessage(text) {

            const message =
                document.getElementById(
                    "interactionMessage"
                );


            message.textContent = text;


            message.classList.add(
                "visible"
            );


            setTimeout(function() {

                message.classList.remove(
                    "visible"
                );

            }, 3000);

        }


        /* =========================
           INSPECTION PROGRESS
        ========================= */

        function checkInspections() {

            let count = 0;


            for (
                let object in inspectedObjects
            ) {

                if (
                    inspectedObjects[object]
                ) {

                    count++;

                }

            }


            if (
                count === 5 &&
                !firstEventTriggered
            ) {

                firstEventTriggered = true;


                setTimeout(function() {

                    showMessage(
                        "You feel as though you are being watched."
                    );

                }, 1000);

            }

        }


        /* =========================
           DOOR
        ========================= */
function inspectDoor() {

    if (!inspectedObjects.door) {

        showMessage(
            "The door is locked."
        );

        inspectedObjects.door = true;

    }

    else {

        let examinedCount = 0;

        for (let object in inspectedObjects) {

            if (inspectedObjects[object]) {
                examinedCount++;
            }

        }


        if (examinedCount < 5) {

            showMessage(
                "The handle refuses to turn."
            );

        }

        else {

            openDoor();

        }

    }


    checkInspections();

}
function openDoor() {

    document.body.innerHTML = `

        <div class="game-screen" id="hallway">

            <p>
                The door opens.
            </p>

        </div>

    `;


    setTimeout(function() {

        document.body.innerHTML = `

            <div class="game-screen">

                <p>
                    The hallway is empty.
                </p>

            </div>

        `;

    }, 3000);

}

        /* =========================
           BED
        ========================= */

        function inspectBed() {

            if (
                !inspectedObjects.bed
            ) {

                showMessage(
                    "The sheets are cold."
                );


                inspectedObjects.bed = true;

            }

            else {

                showMessage(
                    "The warmth has already left them."
                );

            }


            checkInspections();

        }


        /* =========================
           NIGHTSTAND
        ========================= */

        function inspectNightstand() {

            if (
                !inspectedObjects.nightstand
            ) {

                showMessage(
                    "There is nothing on it."
                );


                inspectedObjects.nightstand = true;

            }

            else {

                showMessage(
                    "You find nothing new."
                );

            }


            checkInspections();

        }


        /* =========================
           CROSS
        ========================= */

        function inspectCross() {

            if (
                !inspectedObjects.cross
            ) {

                showMessage(
                    "A wooden cross hangs above the bed."
                );


                inspectedObjects.cross = true;

            }

            else {

                showMessage(
                    "You have always found comfort in it."
                );

            }


            checkInspections();

        }


        /* =========================
           PICTURE
        ========================= */

        function inspectPicture() {

            if (
                !inspectedObjects.picture
            ) {

                showMessage(
                    "The picture is too dark to make out."
                );


                inspectedObjects.picture = true;

            }

            else {

                showMessage(
                    "You think you recognize the faces."
                );

            }


            checkInspections();

        }


    </script>

</body>

</html>
