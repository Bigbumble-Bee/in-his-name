<!DOCTYPE html>
<html>

<head>
    <title>In His Name</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: #c9c4b8;
            font-family: Georgia, serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-screen {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 10px;
            margin: 0;
        }

        .subtitle {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 4px;
            color: #77736b;
        }

        .start {
            margin-top: 80px;
            font-size: 16px;
            letter-spacing: 3px;
            color: #aaa59a;
            background: none;
            border: none;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        .start:hover {
            color: #ffffff;
        }

        .loading-screen {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        .loading-screen p {
            font-size: 14px;
            letter-spacing: 5px;
            color: #77736b;
        }

        .game-screen {
            text-align: center;
        }

        .game-screen p {
            font-size: 18px;
            letter-spacing: 3px;
            color: #aaa59a;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="title-screen">

        <h1>IN HIS NAME</h1>

        <div class="subtitle">
            A STORY OF FAITH
        </div>

        <button class="start" onclick="beginGame()">
            [ CLICK TO BEGIN ]
        </button>

    </div>

    <script>
        function beginGame() {

            document.body.innerHTML = `
                <div class="loading-screen">
                    <p>LOADING...</p>
                </div>
            `;

            setTimeout(function() {

                document.body.innerHTML = `
                    <div class="game-screen">
                        <p>You awaken.</p>
                    </div>
                `;

                setTimeout(function() {

                    document.body.innerHTML = `
                        <div class="game-screen">
                            <p>It is still dark.</p>
                        </div>
                    `;

                }, 3000);

            }, 5000);
        }
    </script>

</body>

</html>
